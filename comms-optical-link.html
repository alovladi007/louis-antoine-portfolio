<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Blue-Green Optical Link</title>
<script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a0e27,#1a1f3a);color:#e0e0e0;padding:20px}.container{max-width:1400px;margin:0 auto}header{text-align:center;padding:40px 20px;background:linear-gradient(135deg,#1e3c72,#2a5298);border-radius:15px;margin-bottom:40px}h1{font-size:2.8em;color:#f59e0b;margin-bottom:15px}.subtitle{font-size:1.2em;color:#60a5fa}.nav-btn{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:white;padding:12px 24px;border-radius:8px;text-decoration:none;display:inline-flex;gap:8px;margin:10px}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px}.stat-card{background:rgba(30,41,59,0.9);padding:20px;border-radius:12px;border:1px solid rgba(96,165,250,0.3)}.stat-card h3{font-size:0.9em;color:#94a3b8;margin-bottom:8px}.stat-card .value{font-size:1.8em;color:#60a5fa;font-weight:bold}.stat-card .unit{font-size:0.9em;color:#f59e0b;margin-left:5px}.plot-container{background:rgba(30,41,59,0.6);padding:25px;border-radius:15px;margin-bottom:25px;border:1px solid rgba(96,165,250,0.2)}.plot-title{font-size:1.3em;color:#f59e0b;margin-bottom:15px}</style></head>
<body><div class="container"><header><h1><i class="fas fa-lightbulb"></i> Blue-Green Optical Link</h1><p class="subtitle">High-Bandwidth Optical Communication (450-550nm)</p>
<a href="cross-domain-comms-complete-project.html" class="nav-btn"><i class="fas fa-home"></i> Back</a></header>
<div class="stats-grid">
<div class="stat-card"><h3>Data Rate</h3><div class="value">5</div><span class="unit">Mbps</span></div>
<div class="stat-card"><h3>Range</h3><div class="value">12</div><span class="unit">m</span></div>
<div class="stat-card"><h3>Wavelength</h3><div class="value">520</div><span class="unit">nm</span></div>
<div class="stat-card"><h3>BER</h3><div class="value">1e-6</div></div>
</div>
<div class="plot-container"><div class="plot-title">Transmission Spectrum</div><div id="plot1"></div></div>
<div class="plot-container"><div class="plot-title">Range vs Data Rate</div><div id="plot2"></div></div></div>
<script>
const wavelengths=Array.from({length:100},(_,i)=>400+i*2);
const transmission=wavelengths.map(w=>w>=450&&w<=550?0.8*Math.exp(-(w-500)**2/2000):0.2);
Plotly.newPlot('plot1',[{x:wavelengths,y:transmission,mode:'lines',fill:'tozeroy',fillcolor:'rgba(96,165,250,0.3)',line:{color:'#60a5fa',width:3}}],{plot_bgcolor:'rgba(15,23,42,0.8)',paper_bgcolor:'rgba(0,0,0,0)',font:{color:'#e0e0e0'},xaxis:{title:'Wavelength (nm)'},yaxis:{title:'Transmission'},margin:{t:20,r:20,b:60,l:60}});
const ranges=Array.from({length:20},(_,i)=>i+1);
const dataRates=ranges.map(r=>8*Math.exp(-r/10));
Plotly.newPlot('plot2',[{x:ranges,y:dataRates,mode:'lines+markers',marker:{size:8,color:'#f59e0b'},line:{color:'#f59e0b',width:2}}],{plot_bgcolor:'rgba(15,23,42,0.8)',paper_bgcolor:'rgba(0,0,0,0)',font:{color:'#e0e0e0'},xaxis:{title:'Range (m)'},yaxis:{title:'Data Rate (Mbps)'},margin:{t:20,r:20,b:60,l:60}});
</script></body></html>
