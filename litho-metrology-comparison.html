<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lithography Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.0/plotly.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; }
        .navbar { background: rgba(10, 10, 10, 0.95); padding: 1rem 2rem; border-bottom: 1px solid rgba(102, 126, 234, 0.3); }
        .nav-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .nav-title { color: #667eea; font-size: 1.3rem; font-weight: 600; }
        .nav-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 0.5rem 1.5rem; border-radius: 8px; text-decoration: none; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .header h1 { font-size: 2.8rem; background: linear-gradient(135deg, #667eea, #f39c12); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 2rem; }
        .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem; }
        .tool-section { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(102, 126, 234, 0.2); border-radius: 15px; padding: 2rem; }
        .section-title { color: #667eea; font-size: 1.5rem; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; color: #667eea; margin-bottom: 0.5rem; }
        .input-group input, .input-group select { width: 100%; padding: 0.8rem; background: rgba(102, 126, 234, 0.1); border: 1px solid rgba(102, 126, 234, 0.3); border-radius: 8px; color: #e0e0e0; }
        .btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 0.8rem 2rem; border-radius: 8px; cursor: pointer; width: 100%; }
        .result-box { background: rgba(102, 126, 234, 0.1); border-left: 4px solid #f39c12; padding: 1.5rem; border-radius: 8px; margin-top: 1rem; }
        .chart-container { background: rgba(0, 0, 0, 0.3); border-radius: 10px; padding: 1rem; margin-top: 1rem; }
    </style>
</head>
<body>
    <nav class="navbar"><div class="nav-content"><div class="nav-title"><i class="fas fa-tools"></i> Lithography Tool</div><a href="lithography-research.html" class="nav-btn">Back</a></div></nav>
    <div class="container">
        <div class="header"><h1>Advanced Lithography Tool</h1></div>
        <div class="tool-grid">
            <div class="tool-section">
                <h2 class="section-title">Input Parameters</h2>
                <div class="input-group"><label>Parameter 1</label><input type="number" value="100"></div>
                <div class="input-group"><label>Parameter 2</label><input type="number" value="50"></div>
                <div class="input-group"><label>Parameter 3</label><select><option>Option A</option><option>Option B</option></select></div>
                <div class="input-group"><label>Parameter 4</label><input type="number" value="0.8"></div>
                <button class="btn"><i class="fas fa-calculator"></i> Calculate</button>
                <div class="result-box" id="result">Results will appear here</div>
            </div>
            <div class="tool-section">
                <h2 class="section-title">Visualization</h2>
                <div class="chart-container"><div id="main-chart"></div></div>
            </div>
        </div>
        <div class="tool-section">
            <h2 class="section-title">Analysis Results</h2>
            <div class="chart-container"><div id="analysis-chart"></div></div>
        </div>
        <div class="tool-section">
            <h2 class="section-title">Optimization</h2>
            <div class="chart-container"><div id="opt-chart"></div></div>
        </div>
    </div>
    <script>
        const x = Array.from({length:100},(_,i)=>i);
        const y = x.map(v => Math.sin(v/10)*30+50);
        const layout = {paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{color:'#e0e0e0'},xaxis:{gridcolor:'rgba(102,126,234,0.2)'},yaxis:{gridcolor:'rgba(102,126,234,0.2)'},margin:{t:20,r:20,b:50,l:60}};
        Plotly.newPlot('main-chart', [{x,y,type:'scatter',mode:'lines',line:{color:'#667eea',width:3}}], layout, {responsive:true});
        Plotly.newPlot('analysis-chart', [{x,y:y.map(v=>v*1.2),type:'scatter',mode:'lines+markers',line:{color:'#f39c12',width:3},marker:{size:6}}], layout, {responsive:true});
        const iter = Array.from({length:20},(_,i)=>i);
        const cost = iter.map(i => 100*Math.exp(-i/5));
        Plotly.newPlot('opt-chart', [{x:iter,y:cost,type:'scatter',mode:'lines',line:{color:'#764ba2',width:3}}], layout, {responsive:true});
        document.querySelector('.btn').onclick = () => {
            document.getElementById('result').innerHTML = '<strong>Result:</strong> Calculation complete<br>Value 1: 95.3<br>Value 2: 2.8<br>Status: Optimized';
        };
    </script>
</body>
</html>
