name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # actions/checkout@v4, configure-pages@v5, upload-pages-artifact@v3,
    # deploy-pages@v4 still ship as Node 20. GitHub is forcing those to
    # Node 24 by default in June 2026 and removing Node 20 from runners
    # in September 2026. Opt in now so the deploy keeps working through
    # the cutover; remove this env once each action ships a Node 24 build.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build a trimmed site/ directory and upload that, instead of
      # shipping the whole repo (which was dragging tens of MB of internal
      # docs, dev scripts, the Flask backend, and the entire .git tree
      # into every Pages deploy).
      - name: Assemble deploy artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.cursorignore' \
            --exclude='.nojekyll' \
            --exclude='node_modules/' \
            --exclude='_site/' \
            --exclude='backend/' \
            --exclude='scripts/' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='archives/' \
            --exclude='logs/' \
            --exclude='*.md' \
            --exclude='LICENSE' \
            --exclude='package.json' \
            --exclude='requirements.txt' \
            --exclude='__pycache__/' \
            --exclude='*.py' \
            --exclude='*.pyc' \
            --exclude='*.log' \
            ./ _site/
          # Restore .nojekyll so Pages serves files starting with _
          touch _site/.nojekyll
          echo "--- artifact size ---"
          du -sh _site/
          echo "--- top-level entries ---"
          ls -1 _site/ | head -50

      # Minify every CSS file in the artifact, in place. The source
      # CSS in the repo stays readable; only the deployed copy is
      # compressed. csso is the minifier — solid track record, doesn't
      # do anything semantically risky at default settings.
      #
      # Why this is worth the ~15 seconds: the homepage ships ~193 KB
      # of unminified CSS (styles.css + styles-advanced.css) on every
      # page load. Minification typically wins 20-30% before gzip and
      # ~10% after gzip; the bigger win is parse time on slow CPUs.
      - name: Minify CSS
        run: |
          set -euo pipefail
          npm install --silent --no-audit --no-fund --global csso-cli@4
          before=$(find _site -name '*.css' -print0 | xargs -0 wc -c | tail -1 | awk '{print $1}')
          # Skip already-minified files (someone might add a *.min.css later)
          find _site -name '*.css' -not -name '*.min.css' -print0 \
            | while IFS= read -r -d '' f; do
                csso "$f" --output "$f"
              done
          after=$(find _site -name '*.css' -print0 | xargs -0 wc -c | tail -1 | awk '{print $1}')
          echo "--- CSS minification ---"
          echo "before: $before bytes"
          echo "after:  $after bytes"
          if [ "$before" -gt 0 ]; then
            saved_pct=$(awk -v b="$before" -v a="$after" 'BEGIN { printf "%.1f", (b-a)*100.0/b }')
            echo "saved:  ${saved_pct}%"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
