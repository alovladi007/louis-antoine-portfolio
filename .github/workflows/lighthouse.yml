name: Lighthouse

on:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
    branches: [main]
  schedule:
    # Daily at 13:30 UTC — 30 min after the smoke cron — to catch any
    # CDN-side regression that doesn't show up immediately after deploy.
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# ----------------------------------------------------------------------------
# About the thresholds in .lighthouserc.json (JSON can't carry comments)
# ----------------------------------------------------------------------------
# Category floors (hard error on regression):
#   performance     >= 0.60   Measured 0.64 on the live deploy after the
#                             three perf rounds (4a4e689 drop unused CDN
#                             libs + lazy YT, af0cd80 image compression,
#                             e56268a hero LCP + critical CSS preload).
#                             Ratchet jumped 0.50 -> 0.65 was 0.01 too
#                             greedy and broke the build; backed off to
#                             0.60 with real headroom. Next ratchet
#                             should follow a Core Web Vitals fix
#                             (CLS 0.107 -> < 0.1 and LCP 5.9 s -> < 4 s
#                             are the open items; CLS may be the inlined
#                             critical CSS cascading differently from
#                             styles.css and triggering a small shift
#                             when the full sheet arrives).
#   accessibility   >= 0.90   The axe-core suite in tests/smoke/a11y.spec.ts
#                             catches critical/serious violations as hard
#                             fails; this Lighthouse threshold is the
#                             complementary don't-backslide guardrail.
#   best-practices  >= 0.80
#   seo             >= 0.90
#
# Core Web Vitals (warn rather than error so a YouTube/CDN cold-start
# blip doesn't fail the build):
#   LCP <= 4000 ms,  CLS <= 0.10,  TBT <= 600 ms,  FCP <= 3000 ms
# ----------------------------------------------------------------------------

jobs:
  lighthouse:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Audit homepage with Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://alovladi007.github.io/louis-antoine-portfolio/
            https://alovladi007.github.io/louis-antoine-portfolio/electronics-projects.html
            https://alovladi007.github.io/louis-antoine-portfolio/photonics-projects.html
          # 3 runs per URL, median absorbs network jitter
          runs: 3
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
