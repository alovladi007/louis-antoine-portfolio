<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Self-Driving Vision Module - Demo</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; margin: 2rem; color: #111; }
      h1 { margin-bottom: 0.5rem; }
      .controls { display: grid; gap: 0.5rem; max-width: 760px; }
      label { font-weight: 600; }
      input[type="text"] { width: 100%; padding: 0.5rem; }
      input[type="file"] { padding: 0.25rem; }
      button { padding: 0.6rem 1rem; font-weight: 600; cursor: pointer; }
      .row { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-top: 1rem; }
      canvas { max-width: 100%; border: 1px solid #ddd; }
      pre { background: #f7f7f7; padding: 1rem; overflow: auto; max-width: 100%; }
      .hint { color: #555; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1>Self-Driving Vision Module</h1>
    <p class="hint">Upload an image to detect lanes and objects. Boxes in red are high risk (≥30% of frame area). Defaults to <code>http://localhost:5000/process-image</code>.</p>

    <div class="controls">
      <label for="backendUrl">Backend URL</label>
      <input id="backendUrl" type="text" value="http://localhost:5000/process-image" />

      <label for="imageInput">Select Image</label>
      <input id="imageInput" type="file" accept="image/*" />

      <button id="runBtn">Process Image</button>
    </div>

    <div class="row">
      <canvas id="canvas" width="640" height="480"></canvas>
      <pre id="jsonOut">Response will appear here...</pre>
    </div>

    <script src="./app.js"></script>
  </body>
  </html>
