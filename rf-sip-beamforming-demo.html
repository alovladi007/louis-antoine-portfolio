<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RF SiP Beamforming Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #0f0f1e; color: #e5e7eb; margin:0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
        .back { display:inline-flex; align-items:center; gap:8px; color:#cbd5e1; text-decoration:none; margin-bottom:1rem; }
        .hero { text-align:center; padding:1.5rem 0; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:1.5rem; }
        .title { font-size: 2rem; background: linear-gradient(135deg, #67e8f9, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color:#94a3b8; margin-top:6px; }
        .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap:1rem; margin:1rem 0 1.25rem 0; }
        .card { background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:1rem; }
        .label { display:flex; justify-content:space-between; color:#94a3b8; margin-bottom:6px; font-size:0.95rem; }
        .value { color:#e5e7eb; }
        .btns { display:flex; gap:.6rem; flex-wrap:wrap; margin:.5rem 0 0 0; }
        .btn { padding:.55rem .95rem; border-radius:8px; border:1px solid rgba(99,102,241,.35); background: linear-gradient(135deg, rgba(99,102,241,.18), rgba(168,85,247,.18)); color:#e5e7eb; cursor:pointer; }
        .chart { background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="rf-sip-codesign.html"><i class="fas fa-arrow-left"></i> Back to RF SiP Project</a>
        <div class="hero">
            <div class="title">Beamforming Pattern Demo</div>
            <div class="subtitle">4×4 Phased Array • Steering • Element Spacing • Frequency</div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="label">Steering Angle (°) <span class="value" id="angleVal">0</span></div>
                <input id="angle" type="range" min="-45" max="45" step="1" value="0" oninput="angleVal.textContent=this.value; update()">
            </div>
            <div class="card">
                <div class="label">Element Spacing (λ) <span class="value" id="spacingVal">0.5</span></div>
                <input id="spacing" type="range" min="0.4" max="0.8" step="0.01" value="0.5" oninput="spacingVal.textContent=this.value; update()">
            </div>
            <div class="card">
                <div class="label">Frequency (GHz) <span class="value" id="freqVal">28</span></div>
                <input id="freq" type="range" min="24" max="40" step="0.5" value="28" oninput="freqVal.textContent=this.value; update()">
            </div>
        </div>

        <div class="btns">
            <button class="btn" onclick="run(event)">Run</button>
            <button class="btn" onclick="resetAll()">Reset</button>
        </div>

        <div class="chart"><div id="chart" style="height:420px"></div></div>
    </div>

    <script>
        function pattern(angle, spacing) {
            const theta=[], gain=[]; const k=2*Math.PI; const steer=angle*Math.PI/180; const N=4;
            for (let d=-90; d<=90; d++) { const th=d*Math.PI/180; let re=0,im=0; for (let n=0;n<N;n++){const ph=k*spacing*n*(Math.sin(th)-Math.sin(steer)); re+=Math.cos(ph); im+=Math.sin(ph);} const mag=Math.sqrt(re*re+im*im); theta.push(d); gain.push(20*Math.log10(mag+1e-6)); }
            return {theta,gain};
        }
        function update(){
            const a=parseFloat(angle.value); const s=parseFloat(spacing.value);
            const {theta,gain}=pattern(a,s);
            Plotly.react('chart',[{x:theta,y:gain,type:'scatter',mode:'lines',line:{color:'#67e8f9'}}],{title:'Array Pattern (dB)',xaxis:{title:'Angle (deg)'},yaxis:{title:'Gain (dB)'}});
        }
        function run(e){ const b=e.target, t=b.textContent; b.disabled=true; let p=0; const id=setInterval(()=>{p+=12; b.textContent=`Running... ${Math.min(100,p)}%`; angle.value=(parseInt(angle.value)+(Math.random()>0.5?1:-1)) ; angleVal.textContent=angle.value; update(); if(p>=100){ clearInterval(id); b.disabled=false; b.textContent=t; }},150); }
        function resetAll(){ angle.value=0; angleVal.textContent='0'; spacing.value=0.5; spacingVal.textContent='0.5'; freq.value=28; freqVal.textContent='28'; update(); }
        // Initialize immediately
        update();
    </script>
</body>
</html>
