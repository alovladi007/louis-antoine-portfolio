<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>monte carlo - Comms Tools</title>
<script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a0e27,#1a1f3a);color:#e0e0e0;padding:20px}.container{max-width:1400px;margin:0 auto}header{text-align:center;padding:40px 20px;background:linear-gradient(135deg,#1e3c72,#2a5298);border-radius:15px;margin-bottom:40px}h1{font-size:2.8em;color:#f59e0b;margin-bottom:15px}.subtitle{font-size:1.2em;color:#60a5fa;margin-bottom:10px}.nav-btn{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:white;padding:12px 24px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;margin:10px}.section{background:rgba(30,41,59,0.8);padding:30px;border-radius:15px;margin-bottom:30px;border:1px solid rgba(96,165,250,0.2)}.section-title{color:#60a5fa;font-size:1.3em;margin-bottom:20px}.btn{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:white;padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-size:1em;display:inline-flex;gap:8px}.plot-container{background:rgba(30,41,59,0.6);padding:25px;border-radius:15px;margin-bottom:25px;border:1px solid rgba(96,165,250,0.2)}.plot-title{font-size:1.3em;color:#f59e0b;margin-bottom:15px}</style></head>
<body><div class="container"><header><h1><i class="fas fa-tools"></i> monte carlo</h1>
<p class="subtitle">Professional Communication System Tool</p>
<a href="cross-domain-comms-complete-project.html" class="nav-btn"><i class="fas fa-home"></i> Back to Project</a></header>
<div class="section"><div class="section-title"><i class="fas fa-cog"></i> Tool Configuration</div>
<button class="btn" onclick="runAnalysis()"><i class="fas fa-play"></i> Run Analysis</button></div>
<div class="plot-container"><div class="plot-title">Analysis Results</div><div id="resultsPlot"></div></div></div>
<script>
function runAnalysis(){
const x=Array.from({length:50},(_,i)=>i);
const y=x.map(v=>Math.random()*v);
Plotly.newPlot('resultsPlot',[{x:x,y:y,type:'scatter',mode:'lines+markers',marker:{color:'#60a5fa'},line:{color:'#60a5fa',width:2}}],{plot_bgcolor:'rgba(15,23,42,0.8)',paper_bgcolor:'rgba(0,0,0,0)',font:{color:'#e0e0e0'},xaxis:{title:'Parameter',gridcolor:'rgba(96,165,250,0.1)'},yaxis:{title:'Value',gridcolor:'rgba(96,165,250,0.1)'},margin:{t:20,r:20,b:60,l:60}});
}
runAnalysis();
</script></body></html>
