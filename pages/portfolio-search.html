                tags: ["Blockchain", "Supply Chain", "Smart Contracts"],

            }
        ];

        // Section icons (FontAwesome) for filter buttons
        const SECTION_ICONS = {
            projects: 'fa-folder-open',
            demos:    'fa-play-circle',
            research: 'fa-flask',
            blog:     'fa-pen-fancy',
            about:    'fa-user',
            pages:    'fa-file-alt'
        };

        // State
        let projects = [];
        const currentFilters = {
            search: '',
            section: '',
            category: '',
            sort: 'relevance'
        };

        // Escape user input before injecting into HTML / regexes
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }
        function escapeRegex(s) {
            return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Build URL relative to /pages/ — index entries are paths from repo root,
        // and this file lives in /pages/, so prepend "../".
        function indexUrl(rel) {
            if (/^https?:/.test(rel)) return rel;
            return rel.startsWith('../') ? rel : '../' + rel;
        }

        // -------- Initialization --------
        async function initializeSearch() {
            try {
                const res = await fetch('../assets/data/search-index.json', { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                projects = (data.items || []).slice();
            } catch (err) {
                console.warn('Falling back to inline index:', err);
                projects = projectsFallback || [];
            }

            renderQuickFilters();
            renderCategoryFilter();
            setupEventListeners();
            setupSearchSuggestions();

            // Honor ?q= query string and ?section= for deep-linkable searches
            const params = new URLSearchParams(location.search);
            const q = params.get('q');
            const section = params.get('section');
            if (q) {
                document.getElementById('searchInput').value = q;
                currentFilters.search = q.toLowerCase();
            }
            if (section) {
                currentFilters.section = section;
                document.querySelectorAll('.quick-filter-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === section);
                });
            }

            filterAndRenderResults();
        }

        function renderQuickFilters() {
            // Build section list with counts, sorted by count desc
            const counts = {};
            projects.forEach(p => { counts[p.section] = (counts[p.section] || 0) + 1; });
            const sections = Object.entries(counts).sort((a, b) => b[1] - a[1]);

            const container = document.getElementById('quickFilters');
            container.innerHTML = sections.map(([sec, n]) => `
                <button class="quick-filter-btn" data-filter="${escapeHtml(sec)}">
                    <i class="fas ${SECTION_ICONS[sec] || 'fa-folder'}"></i>
                    ${escapeHtml(sec.charAt(0).toUpperCase() + sec.slice(1))}
                    <span style="opacity:.7;font-size:.85em;margin-left:.25rem;">${n}</span>
                </button>
            `).join('');
        }

        function renderCategoryFilter() {
            const select = document.getElementById('categoryFilter');
            const cats = {};
            projects.forEach(p => {
                if (!cats[p.categorySlug]) cats[p.categorySlug] = { name: p.category, count: 0 };
                cats[p.categorySlug].count++;
            });
            const sorted = Object.entries(cats).sort((a, b) => a[1].name.localeCompare(b[1].name));
            select.innerHTML = '<option value="">All Categories</option>' + sorted.map(([slug, info]) => `
                <option value="${escapeHtml(slug)}">${escapeHtml(info.name)} (${info.count})</option>
            `).join('');
        }

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentFilters.search = e.target.value.toLowerCase();
                filterAndRenderResults();
                updateSearchSuggestions(e.target.value);
            });

            document.getElementById('quickFilters').addEventListener('click', (e) => {
                const btn = e.target.closest('.quick-filter-btn');
                if (!btn) return;
                const sec = btn.dataset.filter;
                if (btn.classList.contains('active')) {
                    btn.classList.remove('active');
                    currentFilters.section = '';
                } else {
                    document.querySelectorAll('.quick-filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilters.section = sec;
                }
                filterAndRenderResults();
            });

            document.getElementById('categoryFilter').addEventListener('change', (e) => {
                currentFilters.category = e.target.value;
                filterAndRenderResults();
            });

            document.getElementById('sortSelect').addEventListener('change', (e) => {
                currentFilters.sort = e.target.value;
                filterAndRenderResults();
            });
        }

        // -------- Filter + sort --------
        function filterAndRenderResults() {
            const term = currentFilters.search.trim();
            let filtered = projects.filter(p => {
                if (term) {
                    const hay = (p.title + ' ' + p.description + ' ' + (p.tags || []).join(' ') + ' ' + p.category).toLowerCase();
                    if (!hay.includes(term)) return false;
                }
                if (currentFilters.section && p.section !== currentFilters.section) return false;
                if (currentFilters.category && p.categorySlug !== currentFilters.category) return false;
                return true;
            });

            filtered = sortResults(filtered, currentFilters.sort, term);
            renderResults(filtered);
        }

        function scoreRelevance(p, term) {
            if (!term) return 0;
            const t = p.title.toLowerCase();
            if (t === term) return 1000;
            if (t.startsWith(term)) return 500;
            if (t.includes(term)) return 200;
            if ((p.tags || []).some(tag => tag.toLowerCase() === term)) return 150;
            if ((p.description || '').toLowerCase().includes(term)) return 50;
            return 1;
        }

        function sortResults(results, sortBy, term) {
            const arr = results.slice();
            switch (sortBy) {
                case 'title':
                    return arr.sort((a, b) => a.title.localeCompare(b.title));
                case 'category':
                    return arr.sort((a, b) =>
                        a.category.localeCompare(b.category) || a.title.localeCompare(b.title));
                case 'relevance':
                default:
                    if (!term) return arr.sort((a, b) => a.title.localeCompare(b.title));
                    return arr.sort((a, b) => scoreRelevance(b, term) - scoreRelevance(a, term));
            }
        }

        // -------- Render --------
        function renderResults(results) {
            const grid = document.getElementById('resultsGrid');
            const noResults = document.getElementById('noResults');
            const resultCount = document.getElementById('resultCount');

            resultCount.textContent = results.length;

            if (results.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            grid.style.display = 'grid';
            noResults.style.display = 'none';

            // Cap visible results to keep DOM size sane on huge unfiltered queries
            const MAX_VISIBLE = 200;
            const visible = results.slice(0, MAX_VISIBLE);

            grid.innerHTML = visible.map(p => `
                <a class="result-card" href="${escapeHtml(indexUrl(p.url))}" style="text-decoration:none;color:inherit;display:block;">
                    <div class="result-header">
                        <div>
                            <h3 class="result-title">${highlightSearchTerm(p.title)}</h3>
                            <span class="result-category">
                                <i class="fas ${SECTION_ICONS[p.section] || 'fa-folder'}" style="margin-right:.35rem;"></i>${escapeHtml(p.category)}
                            </span>
                        </div>
                    </div>
                    <p class="result-description">${highlightSearchTerm(p.description || '')}</p>
                    <div class="result-tags">
                        ${(p.tags || []).slice(0, 6).map(t => `<span class="result-tag">${escapeHtml(t)}</span>`).join('')}
                    </div>
                    <div class="result-meta">
                        <span style="color:var(--primary);font-size:.85rem;opacity:.8;">${escapeHtml(p.url)}</span>
                        <span class="view-project-btn">View <i class="fas fa-arrow-right"></i></span>
                    </div>
                </a>
            `).join('');

            if (results.length > MAX_VISIBLE) {
                grid.insertAdjacentHTML('beforeend',
                    `<div style="grid-column:1/-1;text-align:center;padding:1.5rem;opacity:.7;">
                        Showing first ${MAX_VISIBLE} of ${results.length}. Refine your search to narrow down.
                     </div>`);
            }
        }

        function highlightSearchTerm(text) {
            const safe = escapeHtml(text || '');
            if (!currentFilters.search) return safe;
            const term = currentFilters.search.trim();
            if (!term) return safe;
            const regex = new RegExp(`(${escapeRegex(term)})`, 'gi');
            return safe.replace(regex, '<mark style="background:rgba(102,126,234,.35);color:#fff;padding:0 2px;border-radius:2px;">$1</mark>');
        }

        function toggleAdvancedSearch(e) {
            e.preventDefault();
            document.getElementById('advancedSearch').classList.toggle('active');
        }

        // -------- Suggestions (lightweight) --------
        function setupSearchSuggestions() {
            const searchInput = document.getElementById('searchInput');
            const suggestions = document.getElementById('searchSuggestions');
            document.addEventListener('click', (e) => {
                if (!searchInput.contains(e.target) && !suggestions.contains(e.target)) {
                    suggestions.classList.remove('active');
                }
            });
        }

        function updateSearchSuggestions(query) {
            const suggestions = document.getElementById('searchSuggestions');
            const q = (query || '').trim().toLowerCase();
            if (q.length < 2 || projects.length === 0) {
                suggestions.classList.remove('active');
                return;
            }
            // Top title matches
            const matches = [];
            for (const p of projects) {
                if (matches.length >= 6) break;
                if (p.title.toLowerCase().includes(q)) matches.push(p);
            }
            if (!matches.length) {
                suggestions.classList.remove('active');
                return;
            }
            suggestions.innerHTML = matches.map(p => `
                <a class="suggestion-item" href="${escapeHtml(indexUrl(p.url))}" style="display:flex;align-items:center;color:var(--text);text-decoration:none;">
                    <i class="fas ${SECTION_ICONS[p.section] || 'fa-folder'}" style="margin-right:.5rem;color:var(--primary);"></i>
                    <span style="flex:1;">${escapeHtml(p.title)}</span>
                    <span style="font-size:.75rem;opacity:.6;">${escapeHtml(p.section)}</span>
                </a>
            `).join('');
            suggestions.classList.add('active');
        }

        // Boot
        document.addEventListener('DOMContentLoaded', initializeSearch);
    </script>
    <script src="../assets/js/chatbot-bubble.js" defer></script>
</body>
</html>
