    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;

        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 2.8em;

            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .subtitle {
            font-size: 1.2em;
            color: #60a5fa;
            margin-bottom: 10px;
        }
        .plot-container {
            background: rgba(30, 41, 59, 0.6);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;

        }
        .plot-title {
            font-size: 1.3em;

            margin-bottom: 15px;
            font-weight: 600;
        }
        #scene3d {
            width: 100%;
            height: 500px;
            border-radius: 10px;
            overflow: hidden;
        }
        .controls-section {
            background: rgba(30, 41, 59, 0.8);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(96, 165, 250, 0.2);
        }
        .btn {
            padding: 12px 24px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            color: white;
        }
        .btn:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transform: translateY(-2px);

    </style>

<body>
    <a href="#content" class="skip-link" style="position:absolute;top:-100px;left:0;z-index:10000;padding:.75rem 1.5rem;background:#1f2937;color:#fff;text-decoration:none;border-radius:0 0 8px 0;font-weight:600;transition:top .2s" onfocus="this.style.top='0'" onblur="this.style.top='-100px'">Skip to main content</a>

    <div class="container">
        <header>
            <h1><i class="fas fa-chart-bar"></i> Visualization Suite</h1>
            <p class="subtitle">Publication-Quality Plots & 3D Trajectories</p>
        </header>

        <div class="plot-container">
            <div class="plot-title"><i class="fas fa-cube"></i> 3D Trajectory Visualization</div>
            <div id="scene3d"></div>
        </div>

        <div class="controls-section">
            <button class="btn" onclick="animateTrajectory()"><i class="fas fa-play"></i> Animate</button>
            <button class="btn" onclick="resetView()"><i class="fas fa-redo"></i> Reset View</button>
            <button class="btn" onclick="exportImage()"><i class="fas fa-camera"></i> Export Image</button>
        </div>

        <div class="plot-container">
            <div class="plot-title"><i class="fas fa-ellipsis-h"></i> Covariance Ellipses</div>
            <div id="covariancePlot"></div>
        </div>

        <div class="plot-container">
            <div class="plot-title"><i class="fas fa-chart-line"></i> Publication Plot</div>
            <div id="publicationPlot"></div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, trajectory;

        function init3DScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e27);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / 500, 0.1, 1000);
            camera.position.set(50, 50, 50);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(document.getElementById('scene3d').offsetWidth, 500);
            document.getElementById('scene3d').appendChild(renderer.domElement);

            // Create trajectory
            const points = [];
            for (let t = 0; t <= 100; t += 1) {
                points.push(new THREE.Vector3(
                    t * 2 + Math.sin(t * 0.1) * 5,
                    t * 0.5 + Math.cos(t * 0.2) * 3,
                    Math.sin(t * 0.05) * 10
                ));
            }

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({color: 0x60a5fa, linewidth: 3});
            trajectory = new THREE.Line(geometry, material);
            scene.add(trajectory);

            // Add grid
            const gridHelper = new THREE.GridHelper(200, 20, 0x60a5fa, 0x1e3c72);
            scene.add(gridHelper);

            // Lighting
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(10, 10, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            trajectory.rotation.z += 0.001;
            renderer.render(scene, camera);
        }

        function animateTrajectory() {
            camera.position.x = 100 * Math.cos(Date.now() * 0.001);
            camera.position.z = 100 * Math.sin(Date.now() * 0.001);
            camera.lookAt(0, 0, 0);
        }

        function resetView() {
            camera.position.set(50, 50, 50);
            camera.lookAt(0, 0, 0);
        }

        function exportImage() {
            const link = document.createElement('a');
            link.download = 'trajectory-3d.png';
            link.href = renderer.domElement.toDataURL();
            link.click();
        }

        // Initialize plots
        init3DScene();

        // Covariance ellipses
        const theta = Array.from({length: 50}, (_, i) => i * 2 * Math.PI / 50);
        const ellipses = [];
        for (let t = 0; t < 5; t++) {
            const scale = (t + 1) * 5;
            ellipses.push({
                x: theta.map(a => scale * Math.cos(a)),
                y: theta.map(a => scale * Math.sin(a) * 0.5),
                mode: 'lines',
                line: {color: `rgba(96, 165, 250, ${0.8 - t * 0.15})`, width: 2},
                showlegend: false
            });
        }

        Plotly.newPlot('covariancePlot', ellipses, {
            plot_bgcolor: 'rgba(15, 23, 42, 0.8)',
            paper_bgcolor: 'rgba(0, 0, 0, 0)',
            font: {color: '#e0e0e0'},
            xaxis: {title: 'East (m)', gridcolor: 'rgba(96, 165, 250, 0.1)', scaleanchor: 'y'},
            yaxis: {title: 'North (m)', gridcolor: 'rgba(96, 165, 250, 0.1)'}
        });

        // Publication quality plot
        const t = Array.from({length: 100}, (_, i) => i);
        const uncertainty = t.map(x => 1 + Math.sqrt(x) * 0.5);

        Plotly.newPlot('publicationPlot', [{
            x: t,
            y: uncertainty,
            mode: 'lines',
            line: {color: '#60a5fa', width: 3},
            fill: 'tozeroy',
            fillcolor: 'rgba(96, 165, 250, 0.2)'
        }], {
            plot_bgcolor: 'rgba(15, 23, 42, 0.8)',
            paper_bgcolor: 'rgba(0, 0, 0, 0)',
            font: {color: '#e0e0e0', family: 'Times New Roman', size: 14},
            xaxis: {title: 'Time (s)', gridcolor: 'rgba(96, 165, 250, 0.1)'},
            yaxis: {title: 'Position Uncertainty (m)', gridcolor: 'rgba(96, 165, 250, 0.1)'}
        }, {responsive: true});
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
</body>
