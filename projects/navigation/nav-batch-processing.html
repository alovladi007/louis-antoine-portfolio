<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cogs"></i> Batch Processing</h1>
            <p class="subtitle">Parameter Sweeps & Sensitivity Analysis</p>
        </header>

        <div class="controls-section">
            <div class="section-title"><i class="fas fa-sliders-h"></i> Batch Configuration</div>
            <button class="btn" onclick="runParameterSweep()"><i class="fas fa-play"></i> Run Parameter Sweep</button>
            <div class="progress-bar">
                <div class="progress-fill" id="progress">0%</div>
            </div>
        </div>

        <div class="plot-container">
            <div class="plot-title"><i class="fas fa-chart-area"></i> Sensitivity Analysis</div>
            <div id="sensitivityPlot"></div>
        </div>

        <div class="plot-container">
            <div class="plot-title"><i class="fas fa-layer-group"></i> Parameter Sweep Results</div>
            <div id="sweepPlot"></div>
        </div>
    </div>

    <script>
        function runParameterSweep() {
            const progress = document.getElementById('progress');
            let current = 0;
            const total = 100;

            const interval = setInterval(() => {
                current += 5;
                progress.style.width = current + '%';
                progress.textContent = current + '%';

                if (current >= 100) {
                    clearInterval(interval);
                    generatePlots();
                }
            }, 100);
        }

        function generatePlots() {
            // Sensitivity analysis
            const params = ['Gyro Drift', 'DVL Accuracy', 'LBL Update Rate', 'Mission Duration'];
            const sensitivity = [0.8, 0.6, 0.4, 0.3];

            Plotly.newPlot('sensitivityPlot', [{
                x: params,
                y: sensitivity,
                type: 'bar',
                marker: {color: ['#ef4444', '#f59e0b', '#60a5fa', '#10b981']}
            }], {
                plot_bgcolor: 'rgba(15, 23, 42, 0.8)',
                paper_bgcolor: 'rgba(0, 0, 0, 0)',
                font: {color: '#e0e0e0'},
                yaxis: {title: 'Sensitivity Factor'}
            });

            // Parameter sweep heatmap
            const x = Array.from({length: 20}, (_, i) => i * 5);
            const y = Array.from({length: 20}, (_, i) => i * 0.5);
            const z = [];
            for (let i = 0; i < 20; i++) {
                const row = [];
                for (let j = 0; j < 20; j++) {
                    row.push(Math.sqrt(x[j]**2 + y[i]**2) / 10);
                }
                z.push(row);
            }

            Plotly.newPlot('sweepPlot', [{
                x: x,
                y: y,
                z: z,
                type: 'contour',
                colorscale: 'Viridis'
            }], {
                plot_bgcolor: 'rgba(15, 23, 42, 0.8)',
                paper_bgcolor: 'rgba(0, 0, 0, 0)',
                font: {color: '#e0e0e0'},
                xaxis: {title: 'Parameter 1'},
                yaxis: {title: 'Parameter 2'}
            });
        }
    </script>
