<body>
    <nav class="navbar"><div class="nav-content"><div class="nav-title"><i class="fas fa-expand"></i> RET Techniques</div><a href="../../research/lithography-research.html" class="nav-btn">Back</a></div></nav>
    <div class="container">
        <div class="header"><h1>Resolution Enhancement</h1></div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="res-stat">32 nm</div><div class="stat-label">Resolution</div></div>
            <div class="stat-card"><div class="stat-value" id="dof-stat">180 nm</div><div class="stat-label">DOF</div></div>
            <div class="stat-card"><div class="stat-value" id="nils-stat">2.8</div><div class="stat-label">NILS</div></div>
            <div class="stat-card"><div class="stat-value" id="mode-stat">Quad</div><div class="stat-label">Illumination</div></div>
        </div>
        <div class="controls-section">
            <h2 class="section-title">RET Parameters</h2>
            <div class="controls-grid">
                <div class="control-group"><label>Illumination Mode</label><input type="range" id="mode" min="0" max="3" step="1" value="2"><div class="control-value"><span>Conv</span><span id="mode-val">Quad</span></div></div>
                <div class="control-group"><label>Sigma Outer</label><input type="range" id="sigma-out" min="0.6" max="1.0" step="0.05" value="0.85"><div class="control-value"><span>0.6</span><span id="sigma-out-val">0.85</span></div></div>
                <div class="control-group"><label>Sigma Inner</label><input type="range" id="sigma-in" min="0" max="0.7" step="0.05" value="0.5"><div class="control-value"><span>0</span><span id="sigma-in-val">0.5</span></div></div>
                <div class="control-group"><label>Polarization</label><input type="range" id="polar" min="0" max="100" value="85"><div class="control-value"><span>0%</span><span id="polar-val">85%</span></div></div>
                <div class="control-group"><label>NA</label><input type="range" id="na" min="0.7" max="1.35" step="0.05" value="1.2"><div class="control-value"><span>0.7</span><span id="na-val">1.2</span></div></div>
                <div class="control-group"><label>Pitch (nm)</label><input type="range" id="pitch" min="50" max="150" value="90"><div class="control-value"><span>50</span><span id="pitch-val">90</span></div></div>
                <div class="control-group"><label>Azimuth (°)</label><input type="range" id="azimuth" min="0" max="90" value="45"><div class="control-value"><span>0</span><span id="azimuth-val">45</span></div></div>
                <div class="control-group"><label>Source Points</label><input type="range" id="points" min="4" max="8" step="1" value="4"><div class="control-value"><span>4</span><span id="points-val">4</span></div></div>
            </div>
        </div>
        <div class="visualization"><h2 class="section-title">Source Shape</h2><div class="chart-container"><div id="source-chart"></div></div></div>
        <div class="visualization"><h2 class="section-title">Aerial Image</h2><div class="chart-container"><div id="aerial-chart"></div></div></div>
        <div class="visualization"><h2 class="section-title">Polarization Effect</h2><div class="chart-container"><div id="polar-chart"></div></div></div>
        <div class="visualization"><h2 class="section-title">NILS Enhancement</h2><div class="chart-container"><div id="nils-chart"></div></div></div>
        <div class="visualization"><h2 class="section-title">DOF vs Mode</h2><div class="chart-container"><div id="dof-chart"></div></div></div>
        <div class="visualization"><h2 class="section-title">Contrast Map</h2><div class="chart-container"><div id="contrast-chart"></div></div></div>
        <div class="visualization"><h2 class="section-title">SMO Result</h2><div class="chart-container"><div id="smo-chart"></div></div></div>
    </div>
    <script>
        let p = {mode:2, sigmaOut:0.85, sigmaIn:0.5, polar:85, na:1.2, pitch:90, azimuth:45, points:4};
        const modes = ['Conv','Annular','Quad','Dipole'];
        ['mode','sigma-out','sigma-in','polar','na','pitch','azimuth','points'].forEach(id => {
            document.getElementById(id).addEventListener('input', e => {
                p[id.replace(/-/g,'')] = parseFloat(e.target.value);
                document.getElementById(id+'-val').textContent = id==='mode'?modes[e.target.value]:e.target.value;
                if(id==='mode') document.getElementById('mode-stat').textContent = modes[e.target.value];
                update();
            });
        });
        function update() {
            const res = 193*0.3/p.na;
            const dof = 193*0.5/(p.na*p.na);
            document.getElementById('res-stat').textContent = res.toFixed(0) + ' nm';
            document.getElementById('dof-stat').textContent = dof.toFixed(0) + ' nm';
            document.getElementById('nils-stat').textContent = (1.5 + p.polar/100).toFixed(1);
            
            const n=100, x=Array.from({length:n},(_,i)=>(i-n/2)*2/n), y=Array.from({length:n},(_,i)=>(i-n/2)*2/n);
            const z = y.map(yi => x.map(xi => {
                const r = Math.sqrt(xi*xi+yi*yi);
                const theta = Math.atan2(yi,xi);
                if(p.mode===0) return r<=p.sigmaOut?1:0;
                if(p.mode===1) return r>=p.sigmaIn&&r<=p.sigmaOut?1:0;
                if(p.mode===2) {
                    const a = (theta+Math.PI)%(Math.PI/2);
                    return r>=p.sigmaIn&&r<=p.sigmaOut&&(a<0.5||a>Math.PI/2-0.5)?1:0;
                }
                return r>=p.sigmaIn&&r<=p.sigmaOut&&Math.abs(Math.cos(theta))>0.7?1:0;
            }));
            Plotly.newPlot('source-chart', [{z,type:'heatmap',colorscale:[[0,'#0a0a0a'],[1,'#f39c12']],showscale:false}],
                {paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{color:'#e0e0e0'},xaxis:{showgrid:false},yaxis:{showgrid:false},margin:{t:20,r:20,b:50,l:60}},{responsive:true});
            
            const pos = Array.from({length:200},(_,i)=>(i-100)*2);
            const k = 2*Math.PI/p.pitch;
            const aerial = pos.map(v => 0.5 + 0.4*Math.cos(k*v)*(1+p.sigmaOut-p.sigmaIn));
            Plotly.newPlot('aerial-chart', [{x:pos,y:aerial,type:'scatter',mode:'lines',line:{color:'#667eea',width:3}}],
                {paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{color:'#e0e0e0'},xaxis:{title:'Position (nm)',gridcolor:'rgba(102,126,234,0.2)'},yaxis:{title:'Intensity',gridcolor:'rgba(102,126,234,0.2)'},margin:{t:20,r:20,b:50,l:60}},{responsive:true});
            
            const angles = Array.from({length:180},(_,i)=>i*2);
            const polEffect = angles.map(a => Math.pow(Math.cos(a*Math.PI/180),2)*p.polar/100 + (100-p.polar)/100);
            Plotly.newPlot('polar-chart', [{x:angles,y:polEffect,type:'scatter',mode:'lines',line:{color:'#f39c12',width:3}}],
                {paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{color:'#e0e0e0'},xaxis:{title:'Angle (°)',gridcolor:'rgba(102,126,234,0.2)'},yaxis:{title:'Transmission',gridcolor:'rgba(102,126,234,0.2)'},margin:{t:20,r:20,b:50,l:60}},{responsive:true});
            
            const pitches = Array.from({length:30},(_,i)=>50+i*4);
            const nils = pitches.map(pt => 1 + (p.sigmaOut-p.sigmaIn)*150/pt);
            Plotly.newPlot('nils-chart', [{x:pitches,y:nils,type:'scatter',mode:'lines+markers',line:{color:'#764ba2',width:3},marker:{size:6}}],
                {paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{color:'#e0e0e0'},xaxis:{title:'Pitch (nm)',gridcolor:'rgba(102,126,234,0.2)'},yaxis:{title:'NILS',gridcolor:'rgba(102,126,234,0.2)'},margin:{t:20,r:20,b:50,l:60}},{responsive:true});
            
            const dofVals = [100,150,200,250];
            Plotly.newPlot('dof-chart', [{x:modes,y:dofVals,type:'bar',marker:{color:'#667eea'}}],
                {paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{color:'#e0e0e0'},xaxis:{title:'Mode',gridcolor:'rgba(102,126,234,0.2)'},yaxis:{title:'DOF (nm)',gridcolor:'rgba(102,126,234,0.2)'},margin:{t:20,r:20,b:50,l:60}},{responsive:true});
            
            const cz = Array.from({length:30},(_,i)=>Array.from({length:30},(_,j)=>0.5+0.3*Math.sin(i/3)*Math.cos(j/3)));
            Plotly.newPlot('contrast-chart', [{z:cz,type:'heatmap',colorscale:[[0,'#0a0a0a'],[0.5,'#667eea'],[1,'#f39c12']],colorbar:{tickfont:{color:'#e0e0e0'}}}],
                {paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{color:'#e0e0e0'},margin:{t:20,r:20,b:50,l:60}},{responsive:true});
            
            const iter = Array.from({length:20},(_,i)=>i+1);
            const cost = iter.map(i => 100*Math.exp(-i/4));
            Plotly.newPlot('smo-chart', [{x:iter,y:cost,type:'scatter',mode:'lines+markers',line:{color:'#f39c12',width:3},marker:{size:8}}],
                {paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{color:'#e0e0e0'},xaxis:{title:'Iteration',gridcolor:'rgba(102,126,234,0.2)'},yaxis:{title:'Cost Function',gridcolor:'rgba(102,126,234,0.2)'},margin:{t:20,r:20,b:50,l:60}},{responsive:true});
        }
        update();
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
</body>
