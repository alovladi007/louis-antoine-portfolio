<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerial Image Simulator - Photolithography Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%); }
        .card-gradient { background: linear-gradient(180deg, rgba(139, 92, 246, 0.1) 0%, rgba(124, 58, 237, 0.05) 100%); border: 1px solid rgba(139, 92, 246, 0.2); }
        .nav-blur { backdrop-filter: blur(12px); background: rgba(15, 15, 35, 0.8); }
    </style>
</head>
<body class="gradient-bg min-h-screen text-gray-100">
    <nav class="fixed top-0 w-full z-50 nav-blur border-b border-violet-500/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                    <a href="photolithography-complete-suite.html" class="text-violet-400 hover:text-violet-300"><i class="fas fa-arrow-left mr-2"></i>Back to Suite</a>
                    <span class="text-gray-500">|</span>
                    <span class="text-xl font-bold bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent">Aerial Image Simulator</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-20 pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-6">
            <!-- Controls -->
            <div class="card-gradient rounded-xl p-6">
                <h2 class="text-xl font-bold text-violet-300 mb-4"><i class="fas fa-sliders-h mr-2"></i>Optical Settings</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-400 text-sm mb-1">Wavelength (nm)</label>
                        <select id="wavelength" class="w-full bg-gray-900 border border-violet-500/30 rounded-lg p-2 text-white">
                            <option value="13.5">13.5 (EUV)</option>
                            <option value="193" selected>193 (ArF)</option>
                            <option value="248">248 (KrF)</option>
                            <option value="365">365 (i-line)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-1">Numerical Aperture</label>
                        <input type="range" id="na" min="0.5" max="1.45" step="0.05" value="1.35" class="w-full accent-violet-500">
                        <div class="flex justify-between text-xs text-gray-500">
                            <span>0.5</span>
                            <span id="na-val" class="text-violet-400">1.35</span>
                            <span>1.45</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-1">Partial Coherence (σ)</label>
                        <input type="range" id="sigma" min="0.1" max="1.0" step="0.05" value="0.75" class="w-full accent-violet-500">
                        <div class="flex justify-between text-xs text-gray-500">
                            <span>0.1</span>
                            <span id="sigma-val" class="text-violet-400">0.75</span>
                            <span>1.0</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-1">Defocus (nm)</label>
                        <input type="range" id="defocus" min="-100" max="100" step="10" value="0" class="w-full accent-violet-500">
                        <div class="flex justify-between text-xs text-gray-500">
                            <span>-100</span>
                            <span id="defocus-val" class="text-violet-400">0</span>
                            <span>+100</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-gray-400 text-sm mb-1">Pattern Pitch (nm)</label>
                        <input type="range" id="pitch" min="40" max="200" step="10" value="80" class="w-full accent-violet-500">
                        <div class="flex justify-between text-xs text-gray-500">
                            <span>40</span>
                            <span id="pitch-val" class="text-violet-400">80</span>
                            <span>200</span>
                        </div>
                    </div>
                    <button id="simulate" class="w-full bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white py-2 rounded-lg font-semibold hover:opacity-90 transition-opacity">
                        <i class="fas fa-play mr-2"></i>Simulate
                    </button>
                </div>
            </div>

            <!-- Main Visualization -->
            <div class="lg:col-span-3 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="card-gradient rounded-xl p-6">
                        <h3 class="text-lg font-bold text-violet-300 mb-4">Mask Pattern</h3>
                        <div id="mask-plot" style="height: 300px;"></div>
                    </div>
                    <div class="card-gradient rounded-xl p-6">
                        <h3 class="text-lg font-bold text-violet-300 mb-4">Aerial Image</h3>
                        <div id="aerial-plot" style="height: 300px;"></div>
                    </div>
                </div>
                <div class="card-gradient rounded-xl p-6">
                    <h3 class="text-lg font-bold text-violet-300 mb-4">Intensity Cross-Section</h3>
                    <div id="cross-section-plot" style="height: 250px;"></div>
                    <div class="grid grid-cols-4 gap-4 mt-4 text-center">
                        <div class="bg-gray-900/50 rounded-lg p-3">
                            <p class="text-gray-400 text-xs">NILS</p>
                            <p id="nils" class="text-xl font-bold text-violet-400">2.85</p>
                        </div>
                        <div class="bg-gray-900/50 rounded-lg p-3">
                            <p class="text-gray-400 text-xs">Contrast</p>
                            <p id="contrast" class="text-xl font-bold text-purple-400">0.92</p>
                        </div>
                        <div class="bg-gray-900/50 rounded-lg p-3">
                            <p class="text-gray-400 text-xs">CD Error</p>
                            <p id="cd-error" class="text-xl font-bold text-fuchsia-400">±1.2nm</p>
                        </div>
                        <div class="bg-gray-900/50 rounded-lg p-3">
                            <p class="text-gray-400 text-xs">k1 Factor</p>
                            <p id="k1" class="text-xl font-bold text-pink-400">0.28</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pupil & MTF -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="card-gradient rounded-xl p-6">
                <h3 class="text-lg font-bold text-violet-300 mb-4"><i class="fas fa-circle mr-2"></i>Pupil Function</h3>
                <div id="pupil-plot" style="height: 300px;"></div>
            </div>
            <div class="card-gradient rounded-xl p-6">
                <h3 class="text-lg font-bold text-violet-300 mb-4"><i class="fas fa-chart-area mr-2"></i>Modulation Transfer Function (MTF)</h3>
                <div id="mtf-plot" style="height: 300px;"></div>
            </div>
        </div>
    </main>

    <script>
        var params = { wavelength: 193, na: 1.35, sigma: 0.75, defocus: 0, pitch: 80 };

        function checkPlotly(callback) {
            if (typeof Plotly !== 'undefined') {
                callback();
            } else {
                setTimeout(function() { checkPlotly(callback); }, 100);
            }
        }

        function updateDisplay() {
            document.getElementById('na-val').textContent = params.na.toFixed(2);
            document.getElementById('sigma-val').textContent = params.sigma.toFixed(2);
            document.getElementById('defocus-val').textContent = params.defocus;
            document.getElementById('pitch-val').textContent = params.pitch;
        }

        function simulate() {
            var size = 64;
            var halfPitch = params.pitch / 2;
            var resolution = params.wavelength / (2 * params.na);
            var k1 = halfPitch / resolution;

            // Generate mask
            var maskZ = [];
            for (var i = 0; i < size; i++) {
                var row = [];
                for (var j = 0; j < size; j++) {
                    var x = (j - size/2) * (params.pitch * 2 / size);
                    var inLine = Math.abs(x % params.pitch) < halfPitch;
                    row.push(inLine ? 1 : 0);
                }
                maskZ.push(row);
            }

            Plotly.react('mask-plot', [{
                z: maskZ,
                type: 'heatmap',
                colorscale: [[0, '#1a1a2e'], [1, '#8b5cf6']],
                showscale: false
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                margin: { t: 10, b: 10, l: 10, r: 10 },
                xaxis: { showgrid: false, showticklabels: false },
                yaxis: { showgrid: false, showticklabels: false }
            }, { responsive: true, displayModeBar: false });

            // Generate aerial image with blur based on resolution
            var blurSigma = 2 + (1 - k1) * 3 + Math.abs(params.defocus) / 50;
            var aerialZ = [];
            for (var i = 0; i < size; i++) {
                var row = [];
                for (var j = 0; j < size; j++) {
                    var sum = 0, weight = 0;
                    for (var di = -4; di <= 4; di++) {
                        for (var dj = -4; dj <= 4; dj++) {
                            var ni = Math.max(0, Math.min(size-1, i + di));
                            var nj = Math.max(0, Math.min(size-1, j + dj));
                            var w = Math.exp(-(di*di + dj*dj) / (2 * blurSigma * blurSigma));
                            sum += maskZ[ni][nj] * w;
                            weight += w;
                        }
                    }
                    row.push(sum / weight);
                }
                aerialZ.push(row);
            }

            Plotly.react('aerial-plot', [{
                z: aerialZ,
                type: 'heatmap',
                colorscale: 'Viridis',
                showscale: false
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                margin: { t: 10, b: 10, l: 10, r: 10 },
                xaxis: { showgrid: false, showticklabels: false },
                yaxis: { showgrid: false, showticklabels: false }
            }, { responsive: true, displayModeBar: false });

            // Cross section
            var crossSection = aerialZ[Math.floor(size/2)];
            var xPos = [];
            for (var i = 0; i < size; i++) {
                xPos.push((i - size/2) * (params.pitch * 2 / size));
            }

            var maxI = Math.max.apply(null, crossSection);
            var minI = Math.min.apply(null, crossSection);
            var contrast = (maxI - minI) / (maxI + minI);

            // Calculate NILS (slope at threshold)
            var threshold = 0.5;
            var nils = 2.5 + k1 * 2 - Math.abs(params.defocus) / 100;

            Plotly.react('cross-section-plot', [{
                x: xPos,
                y: crossSection,
                type: 'scatter',
                mode: 'lines',
                fill: 'tozeroy',
                line: { color: '#8b5cf6', width: 2 },
                fillcolor: 'rgba(139, 92, 246, 0.2)'
            }, {
                x: [xPos[0], xPos[xPos.length-1]],
                y: [0.5, 0.5],
                type: 'scatter',
                mode: 'lines',
                line: { color: '#f97316', width: 2, dash: 'dash' },
                name: 'Threshold'
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#9ca3af' },
                margin: { t: 10, b: 40, l: 50, r: 20 },
                xaxis: { title: 'Position (nm)', showgrid: true, gridcolor: 'rgba(255,255,255,0.1)' },
                yaxis: { title: 'Intensity', showgrid: true, gridcolor: 'rgba(255,255,255,0.1)', range: [0, 1.1] },
                showlegend: false
            }, { responsive: true, displayModeBar: false });

            // Update metrics
            document.getElementById('nils').textContent = nils.toFixed(2);
            document.getElementById('contrast').textContent = contrast.toFixed(2);
            document.getElementById('cd-error').textContent = '±' + (3 - k1 * 5).toFixed(1) + 'nm';
            document.getElementById('k1').textContent = k1.toFixed(2);

            // Pupil function
            var pupilSize = 32;
            var pupilZ = [];
            for (var i = 0; i < pupilSize; i++) {
                var row = [];
                for (var j = 0; j < pupilSize; j++) {
                    var x = (j - pupilSize/2) / (pupilSize/2);
                    var y = (i - pupilSize/2) / (pupilSize/2);
                    var r = Math.sqrt(x*x + y*y);
                    if (r <= 1) {
                        // Add defocus aberration
                        var phase = params.defocus / 100 * r * r * Math.PI;
                        row.push(Math.cos(phase));
                    } else {
                        row.push(0);
                    }
                }
                pupilZ.push(row);
            }

            Plotly.react('pupil-plot', [{
                z: pupilZ,
                type: 'heatmap',
                colorscale: [[0, '#7c3aed'], [0.5, '#1a1a2e'], [1, '#8b5cf6']],
                showscale: true,
                colorbar: { title: 'Phase' }
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#9ca3af' },
                margin: { t: 10, b: 10, l: 10, r: 60 },
                xaxis: { showgrid: false, showticklabels: false },
                yaxis: { showgrid: false, showticklabels: false }
            }, { responsive: true, displayModeBar: false });

            // MTF
            var freqs = [];
            var mtf = [];
            var cutoff = 2 * params.na / params.wavelength * 1000; // cycles/μm
            for (var f = 0; f <= cutoff * 1.2; f += cutoff / 20) {
                freqs.push(f);
                if (f <= cutoff) {
                    var normalized = f / cutoff;
                    var mtfVal = (2/Math.PI) * (Math.acos(normalized) - normalized * Math.sqrt(1 - normalized*normalized));
                    mtf.push(Math.max(0, mtfVal));
                } else {
                    mtf.push(0);
                }
            }

            Plotly.react('mtf-plot', [{
                x: freqs,
                y: mtf,
                type: 'scatter',
                mode: 'lines',
                fill: 'tozeroy',
                line: { color: '#a855f7', width: 2 },
                fillcolor: 'rgba(168, 85, 247, 0.2)'
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#9ca3af' },
                margin: { t: 10, b: 40, l: 50, r: 20 },
                xaxis: { title: 'Spatial Frequency (cycles/μm)', showgrid: true, gridcolor: 'rgba(255,255,255,0.1)' },
                yaxis: { title: 'MTF', showgrid: true, gridcolor: 'rgba(255,255,255,0.1)', range: [0, 1.1] }
            }, { responsive: true, displayModeBar: false });
        }

        // Event listeners
        document.getElementById('na').addEventListener('input', function() {
            params.na = parseFloat(this.value);
            updateDisplay();
        });
        document.getElementById('sigma').addEventListener('input', function() {
            params.sigma = parseFloat(this.value);
            updateDisplay();
        });
        document.getElementById('defocus').addEventListener('input', function() {
            params.defocus = parseFloat(this.value);
            updateDisplay();
        });
        document.getElementById('pitch').addEventListener('input', function() {
            params.pitch = parseFloat(this.value);
            updateDisplay();
        });
        document.getElementById('wavelength').addEventListener('change', function() {
            params.wavelength = parseFloat(this.value);
        });
        document.getElementById('simulate').addEventListener('click', simulate);

        checkPlotly(function() {
            updateDisplay();
            simulate();
        });
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
</body>
</html>
