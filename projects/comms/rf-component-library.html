<!DOCTYPE html>
<html lang="en">
<head>
    <!-- SEO + OG (auto-injected by scripts/inject-meta-tags.py) -->
    <meta name="description" content="Component Library - RF/SiP Co-Design — part of the engineering portfolio of Louis Vladimir Antoine, covering hardware, semiconductors, photonics, and software systems.">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Library - RF/SiP Co-Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #0891b2 0%, #06b6d4 50%, #22d3ee 100%); }
        .component-card { background: #1f2937; border: 1px solid rgba(6,182,212,0.3); border-radius: 12px; padding: 16px; cursor: pointer; margin-bottom: 12px; }
        .component-card:hover { border-color: #22d3ee; }
        .component-card.selected { box-shadow: 0 0 0 2px #22d3ee; }
        .spec-box { background: rgba(55,65,81,0.5); border-radius: 8px; padding: 12px; text-align: center; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <nav class="bg-gray-900/95 backdrop-blur-sm border-b border-cyan-500/20 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="rf-sip-codesign.html" class="flex items-center text-cyan-400 hover:text-cyan-300">
                    <i class="fas fa-arrow-left mr-2"></i>Back to RF/SiP Co-Design
                </a>
                <span class="text-cyan-400 font-semibold">Component Library</span>
            </div>
        </div>
    </nav>

    <section class="gradient-bg py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4"><i class="fas fa-database mr-4"></i>Component Library</h1>
            <p class="text-xl text-cyan-100">RF component models and S-parameter database</p>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex gap-4 mb-6">
            <div class="flex-1">
                <input type="text" id="searchBox" placeholder="Search components..."
                    class="w-full bg-gray-800 border border-cyan-500/30 rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:border-cyan-400 focus:outline-none"
                    onkeyup="filterComponents()">
            </div>
            <select id="categoryFilter" class="bg-gray-800 border border-cyan-500/30 rounded-lg px-4 py-3 text-white" onchange="filterComponents()">
                <option value="all">All Categories</option>
                <option value="capacitor">Capacitors</option>
                <option value="inductor">Inductors</option>
                <option value="resistor">Resistors</option>
                <option value="filter">Filters</option>
                <option value="amplifier">Amplifiers</option>
                <option value="connector">Connectors</option>
            </select>
        </div>

        <div class="grid lg:grid-cols-3 gap-6">
            <!-- Component List - LEFT SIDE -->
            <div class="lg:col-span-1" id="componentList">
                <!-- Components rendered by JavaScript below -->
            </div>

            <!-- Component Details - RIGHT SIDE -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h2 class="text-2xl font-bold text-cyan-400" id="componentName">Select a Component</h2>
                            <p class="text-gray-400" id="componentDesc">Choose from the library to view details</p>
                        </div>
                        <span class="px-3 py-1 bg-cyan-600/30 text-cyan-400 rounded-full text-sm" id="componentCategory">-</span>
                    </div>
                    <div class="grid md:grid-cols-4 gap-4" id="componentSpecs"></div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                    <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-chart-line mr-2"></i>S-Parameters</h3>
                    <div id="sparamChart" style="height: 300px; background: #111827; border-radius: 8px;"></div>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                        <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-compass mr-2"></i>Smith Chart</h3>
                        <div id="smithChart" style="height: 280px; background: #111827; border-radius: 8px;"></div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                        <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-project-diagram mr-2"></i>Equivalent Circuit</h3>
                        <div id="equivCircuit" class="flex items-center justify-center p-4 bg-gray-900 rounded-lg min-h-48"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Component database
        var COMPONENTS = [
            { id: 'mlcc-100pf', name: 'MLCC 100pF 0201', category: 'capacitor', manufacturer: 'Murata', partNumber: 'GRM033R71E101KA01', specs: { capacitance: '100 pF', voltage: '25V', tolerance: '±10%', size: '0201' }, srf: 8.5, esr: 0.15, esl: 0.3 },
            { id: 'mlcc-1nf', name: 'MLCC 1nF 0402', category: 'capacitor', manufacturer: 'Murata', partNumber: 'GRM155R71H102KA01', specs: { capacitance: '1 nF', voltage: '50V', tolerance: '±10%', size: '0402' }, srf: 2.5, esr: 0.1, esl: 0.5 },
            { id: 'inductor-10nh', name: 'RF Inductor 10nH', category: 'inductor', manufacturer: 'Coilcraft', partNumber: '0402HP-10NXJLW', specs: { inductance: '10 nH', current: '300 mA', dcr: '0.35 Ω', size: '0402' }, srf: 6.0, q: 45 },
            { id: 'inductor-22nh', name: 'RF Inductor 22nH', category: 'inductor', manufacturer: 'Coilcraft', partNumber: '0402HP-22NXJLW', specs: { inductance: '22 nH', current: '250 mA', dcr: '0.5 Ω', size: '0402' }, srf: 4.2, q: 50 },
            { id: 'resistor-50ohm', name: 'Thin Film 50Ω', category: 'resistor', manufacturer: 'Vishay', partNumber: 'FC0402E50R0BSTS', specs: { resistance: '50 Ω', power: '63 mW', tolerance: '±0.1%', size: '0402' }, tcr: 25 },
            { id: 'filter-2.4ghz', name: 'SAW Filter 2.4GHz', category: 'filter', manufacturer: 'Murata', partNumber: 'SAFFB2G40MA0F0A', specs: { frequency: '2.4 GHz', bandwidth: '100 MHz', insertion: '1.5 dB', size: '1.1×0.9mm' }, il: 1.5, rl: 15 },
            { id: 'lna-28ghz', name: 'mmWave LNA 28GHz', category: 'amplifier', manufacturer: 'Analog Devices', partNumber: 'HMC1040', specs: { frequency: '24-40 GHz', gain: '22 dB', nf: '2.5 dB', p1dB: '10 dBm' }, gain: 22, nf: 2.5 },
            { id: 'sma-connector', name: 'SMA Connector', category: 'connector', manufacturer: 'Amphenol', partNumber: '132134', specs: { frequency: 'DC-18 GHz', impedance: '50 Ω', vswr: '1.15:1', gender: 'Female' }, rl: 20 }
        ];

        var selectedId = null;

        // Render component list
        function renderList() {
            var filter = document.getElementById('categoryFilter').value;
            var search = document.getElementById('searchBox').value.toLowerCase();
            var container = document.getElementById('componentList');
            var html = '';

            for (var i = 0; i < COMPONENTS.length; i++) {
                var c = COMPONENTS[i];
                // Filter by category
                if (filter !== 'all' && c.category !== filter) continue;
                // Filter by search
                if (search && c.name.toLowerCase().indexOf(search) === -1 && c.partNumber.toLowerCase().indexOf(search) === -1) continue;

                var isSelected = (selectedId === c.id);
                var specKeys = Object.keys(c.specs);
                var specHtml = '';
                for (var j = 0; j < Math.min(2, specKeys.length); j++) {
                    specHtml += '<span style="background:rgba(55,65,81,0.5);padding:4px 8px;border-radius:4px;font-size:12px;margin-right:4px;">' + c.specs[specKeys[j]] + '</span>';
                }

                html += '<div class="component-card' + (isSelected ? ' selected' : '') + '" onclick="selectComponent(\'' + c.id + '\')">';
                html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">';
                html += '<h4 style="font-weight:600;color:white;">' + c.name + '</h4>';
                html += '<span style="font-size:12px;background:#374151;padding:4px 8px;border-radius:4px;">' + c.category + '</span>';
                html += '</div>';
                html += '<p style="font-size:14px;color:#9ca3af;">' + c.manufacturer + ' • ' + c.partNumber + '</p>';
                html += '<div style="margin-top:8px;">' + specHtml + '</div>';
                html += '</div>';
            }

            container.innerHTML = html;
        }

        // Filter components
        function filterComponents() {
            renderList();
        }

        // Select a component
        function selectComponent(id) {
            selectedId = id;
            var comp = null;
            for (var i = 0; i < COMPONENTS.length; i++) {
                if (COMPONENTS[i].id === id) {
                    comp = COMPONENTS[i];
                    break;
                }
            }
            if (!comp) return;

            // Update header
            document.getElementById('componentName').textContent = comp.name;
            document.getElementById('componentDesc').textContent = comp.manufacturer + ' • ' + comp.partNumber;
            document.getElementById('componentCategory').textContent = comp.category;

            // Update specs
            var specKeys = Object.keys(comp.specs);
            var specsHtml = '';
            for (var i = 0; i < specKeys.length; i++) {
                specsHtml += '<div class="spec-box">';
                specsHtml += '<div style="font-size:20px;font-weight:bold;color:#22d3ee;">' + comp.specs[specKeys[i]] + '</div>';
                specsHtml += '<div style="font-size:12px;color:#9ca3af;text-transform:capitalize;">' + specKeys[i] + '</div>';
                specsHtml += '</div>';
            }
            document.getElementById('componentSpecs').innerHTML = specsHtml;

            // Update equivalent circuit
            updateCircuit(comp);

            // Re-render list to show selection
            renderList();

            // Update charts if Plotly is loaded
            if (typeof Plotly !== 'undefined') {
                updateCharts(comp);
            }
        }

        function updateCircuit(comp) {
            var div = document.getElementById('equivCircuit');
            var html = '<div style="display:flex;align-items:center;gap:8px;">';
            if (comp.category === 'capacitor') {
                html += '<span style="color:#9ca3af;">○</span>';
                html += '<div style="width:32px;height:2px;background:#22d3ee;"></div>';
                html += '<div style="background:#9333ea;color:white;padding:4px 8px;border-radius:4px;font-size:12px;">ESL<br>' + (comp.esl || 0.3) + 'nH</div>';
                html += '<div style="width:32px;height:2px;background:#22d3ee;"></div>';
                html += '<div style="background:#d97706;color:white;padding:4px 8px;border-radius:4px;font-size:12px;">ESR<br>' + (comp.esr || 0.1) + 'Ω</div>';
                html += '<div style="width:32px;height:2px;background:#22d3ee;"></div>';
                html += '<div style="background:#16a34a;color:white;padding:4px 8px;border-radius:4px;font-size:12px;">C<br>' + comp.specs.capacitance + '</div>';
                html += '<div style="width:32px;height:2px;background:#22d3ee;"></div>';
                html += '<span style="color:#9ca3af;">○</span>';
            } else if (comp.category === 'inductor') {
                html += '<span style="color:#9ca3af;">○</span>';
                html += '<div style="width:32px;height:2px;background:#22d3ee;"></div>';
                html += '<div style="background:#d97706;color:white;padding:4px 8px;border-radius:4px;font-size:12px;">L<br>' + comp.specs.inductance + '</div>';
                html += '<div style="width:32px;height:2px;background:#22d3ee;"></div>';
                html += '<div style="background:#4b5563;color:white;padding:4px 8px;border-radius:4px;font-size:12px;">DCR<br>' + comp.specs.dcr + '</div>';
                html += '<div style="width:32px;height:2px;background:#22d3ee;"></div>';
                html += '<span style="color:#9ca3af;">○</span>';
            } else {
                html += '<span style="color:#9ca3af;">Component model: ' + comp.category + '</span>';
            }
            html += '</div>';
            div.innerHTML = html;
        }

        function updateCharts(comp) {
            var freq = [], s11 = [], s21 = [];
            var srf = comp.srf || 10;

            for (var f = 0.1; f <= 20; f += 0.2) {
                freq.push(f);
                if (comp.category === 'capacitor') {
                    var ratio = f / srf;
                    s11.push(-10 - 10 / (1 + Math.pow(ratio * 2, 2)));
                    s21.push(Math.max(-0.1 - 0.5 * ratio * ratio, -40));
                } else if (comp.category === 'inductor') {
                    var ratio = f / srf;
                    s11.push(Math.min(-15 + 10 * ratio, 0));
                    s21.push(Math.max(-0.2 - ratio * ratio, -40));
                } else if (comp.category === 'filter') {
                    var delta = (f - 2.4) / 0.1;
                    s11.push(-15 * Math.exp(-delta * delta) - 3);
                    s21.push(-1.5 - 20 * Math.min(delta * delta, 10));
                } else if (comp.category === 'amplifier') {
                    s11.push(-15 + Math.random() * 2);
                    s21.push((comp.gain || 20) - Math.abs(f - 28) * 0.5);
                } else {
                    s11.push(-20 + Math.random() * 2);
                    s21.push(-0.1 - f * 0.01);
                }
            }

            Plotly.newPlot('sparamChart', [
                { x: freq, y: s11, name: 'S11', line: { color: '#06b6d4' } },
                { x: freq, y: s21, name: 'S21', line: { color: '#10b981' } }
            ], {
                paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' }, margin: { l: 50, r: 20, t: 10, b: 40 },
                xaxis: { title: 'Frequency (GHz)', gridcolor: '#374151' },
                yaxis: { title: 'Magnitude (dB)', gridcolor: '#374151' },
                legend: { orientation: 'h', y: -0.15 }
            }, { responsive: true });

            // Smith chart
            var unitX = [], unitY = [];
            for (var t = 0; t <= 360; t += 5) {
                unitX.push(Math.cos(t * Math.PI / 180));
                unitY.push(Math.sin(t * Math.PI / 180));
            }
            var s11X = [], s11Y = [];
            for (var f = 0.1; f <= 20; f += 0.5) {
                var angle = f * 20 * Math.PI / 180;
                var mag = 0.3 + 0.5 * Math.exp(-f / 5);
                s11X.push(mag * Math.cos(angle));
                s11Y.push(mag * Math.sin(angle));
            }

            Plotly.newPlot('smithChart', [
                { x: unitX, y: unitY, mode: 'lines', line: { color: '#6b7280' }, showlegend: false },
                { x: s11X, y: s11Y, mode: 'lines+markers', line: { color: '#06b6d4' }, marker: { size: 3 }, name: 'S11' }
            ], {
                paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' }, margin: { l: 20, r: 20, t: 10, b: 20 },
                xaxis: { range: [-1.2, 1.2], showgrid: false },
                yaxis: { range: [-1.2, 1.2], showgrid: false, scaleanchor: 'x' },
                showlegend: false
            }, { responsive: true });
        }

        // Initialize on page load
        renderList();

        // Wait for Plotly then select first component
        function checkPlotly() {
            if (typeof Plotly !== 'undefined') {
                selectComponent('mlcc-100pf');
            } else {
                setTimeout(checkPlotly, 200);
            }
        }
        checkPlotly();
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
</body>
</html>
