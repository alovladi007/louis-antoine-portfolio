<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RF SiP Thermal Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #0f0f1e; color: #e5e7eb; margin:0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
        .back { display:inline-flex; align-items:center; gap:8px; color:#cbd5e1; text-decoration:none; margin-bottom:1rem; }
        .hero { text-align:center; padding:1.5rem 0; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:1.5rem; }
        .title { font-size: 2rem; background: linear-gradient(135deg, #f59e0b, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color:#94a3b8; margin-top:6px; }
        .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap:1rem; margin:1rem 0 1.25rem 0; }
        .card { background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:1rem; }
        .label { display:flex; justify-content:space-between; color:#94a3b8; margin-bottom:6px; font-size:0.95rem; }
        .value { color:#e5e7eb; }
        .btns { display:flex; gap:.6rem; flex-wrap:wrap; margin:.5rem 0 0 0; }
        .btn { padding:.55rem .95rem; border-radius:8px; border:1px solid rgba(99,102,241,.35); background: linear-gradient(135deg, rgba(99,102,241,.18), rgba(168,85,247,.18)); color:#e5e7eb; cursor:pointer; }
        .chart { background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="rf-sip-codesign.html"><i class="fas fa-arrow-left"></i> Back to RF SiP Project</a>
        <div class="hero">
            <div class="title">Thermal Model Demo</div>
            <div class="subtitle">Power • Ambient • Thermal Resistance • Transient Junction Temperature</div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="label">Power (W) <span class="value" id="pVal">8.0</span></div>
                <input id="p" type="range" min="2" max="20" step="0.5" value="8" oninput="pVal.textContent=this.value; update()">
            </div>
            <div class="card">
                <div class="label">Ambient (°C) <span class="value" id="aVal">25</span></div>
                <input id="a" type="range" min="-10" max="60" step="1" value="25" oninput="aVal.textContent=this.value; update()">
            </div>
            <div class="card">
                <div class="label">Thermal R (°C/W) <span class="value" id="rVal">2.5</span></div>
                <input id="r" type="range" min="1.0" max="5.0" step="0.1" value="2.5" oninput="rVal.textContent=this.value; update()">
            </div>
        </div>

        <div class="btns">
            <button class="btn" onclick="run(event)">Run</button>
            <button class="btn" onclick="resetAll()">Reset</button>
        </div>

        <div class="chart"><div id="chart" style="height:420px"></div></div>
    </div>

    <script>
        function curve(p,amb,rth){ const tj=amb+p*rth; const x=Array.from({length:121},(_,i)=>i); const y=x.map(t=> amb + (tj-amb)*(1-Math.exp(-t/15))); return {x,y,tj}; }
        function update(){ const p=parseFloat(window.p.value), a=parseFloat(window.a.value), r=parseFloat(window.r.value); const {x,y,tj}=curve(p,a,r); Plotly.react('chart',[{x,y,type:'scatter',mode:'lines',line:{color:'#f59e0b'}}],{title:`Junction Temperature vs Time (Tj≈${tj.toFixed(1)}°C)`,xaxis:{title:'Time (s)'},yaxis:{title:'Temperature (°C)'}}); }
        function run(e){ const b=e.target,t=b.textContent; b.disabled=true; let pr=0; const id=setInterval(()=>{ pr+=13; b.textContent=`Running... ${Math.min(100,pr)}%`; const base=parseFloat(window.p.value); window.p.value=Math.max(2,Math.min(20, base+(Math.random()-0.5)*0.6)); pVal.textContent=window.p.value; update(); if(pr>=100){ clearInterval(id); b.disabled=false; b.textContent=t; } },160); }
        function resetAll(){ p.value=8; pVal.textContent='8.0'; a.value=25; aVal.textContent='25'; r.value=2.5; rVal.textContent='2.5'; update(); }
        // Wait for Plotly to load
        function init() {
            if (typeof Plotly === 'undefined') { setTimeout(init, 50); return; }
            update();
        }
        init();
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
</body>
</html>
