<body class="bg-gray-900 text-white min-h-screen">

    <section class="gradient-bg py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4"><i class="fas fa-wave-square mr-4"></i>Signal Integrity</h1>
            <p class="text-xl text-cyan-100">Eye diagram analysis and high-speed channel simulation</p>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid lg:grid-cols-4 gap-6">
            <div class="space-y-6">
                <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                    <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-tachometer-alt mr-2"></i>Data Rate</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Signaling</label>
                            <select id="signaling" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                                <option value="nrz">NRZ (PAM2)</option>
                                <option value="pam4" selected>PAM4</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Baud Rate: <span id="baudVal">56</span> Gbaud</label>
                            <input type="range" id="baud" min="10" max="112" value="56" class="w-full accent-cyan-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Channel Length: <span id="lenVal">10</span> mm</label>
                            <input type="range" id="length" min="1" max="50" value="10" class="w-full accent-cyan-500">
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                    <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-route mr-2"></i>Channel</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Loss @ Nyquist: <span id="lossVal">15</span> dB</label>
                            <input type="range" id="loss" min="5" max="40" value="15" class="w-full accent-cyan-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Crosstalk: <span id="xtalkVal">-25</span> dB</label>
                            <input type="range" id="xtalk" min="-50" max="-10" value="-25" class="w-full accent-cyan-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Jitter (RJ): <span id="jitterVal">0.5</span> ps</label>
                            <input type="range" id="jitter" min="0.1" max="5" step="0.1" value="0.5" class="w-full accent-cyan-500">
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                    <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-magic mr-2"></i>Equalization</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">TX FFE Taps</label>
                            <select id="txTaps" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                                <option value="0">None</option>
                                <option value="3" selected>3-tap</option>
                                <option value="5">5-tap</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">RX CTLE Gain: <span id="ctleVal">10</span> dB</label>
                            <input type="range" id="ctle" min="0" max="20" value="10" class="w-full accent-cyan-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">RX DFE Taps</label>
                            <select id="dfeTaps" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                                <option value="0">None</option>
                                <option value="5">5-tap</option>
                                <option value="10" selected>10-tap</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="simulate()" class="w-full mt-4 bg-cyan-600 hover:bg-cyan-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors">
                        <i class="fas fa-play mr-2"></i>Simulate
                    </button>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">
                <div class="grid md:grid-cols-4 gap-4">
                    <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-4 text-center">
                        <div class="text-3xl font-bold text-cyan-400" id="eyeHeight">0.35</div>
                        <div class="text-sm text-gray-400">Eye Height (V)</div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-4 text-center">
                        <div class="text-3xl font-bold text-green-400" id="eyeWidth">0.72 UI</div>
                        <div class="text-sm text-gray-400">Eye Width</div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-4 text-center">
                        <div class="text-3xl font-bold text-purple-400" id="ber">1e-12</div>
                        <div class="text-sm text-gray-400">BER</div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-4 text-center">
                        <div class="text-3xl font-bold text-amber-400" id="margin">2.5 dB</div>
                        <div class="text-sm text-gray-400">Margin</div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                    <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-eye mr-2"></i>Eye Diagram</h3>
                    <div id="eyeDiagram" style="height: 350px;"></div>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                        <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-chart-line mr-2"></i>Channel Response</h3>
                        <div id="channelResponse" style="height: 280px;"></div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                        <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-wave-square mr-2"></i>Pulse Response</h3>
                        <div id="pulseResponse" style="height: 280px;"></div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                    <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-chart-bar mr-2"></i>Bathtub Curve (BER)</h3>
                    <div id="bathtub" style="height: 250px;"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const baud = document.getElementById('baud');
        const baudVal = document.getElementById('baudVal');
        const length = document.getElementById('length');
        const lenVal = document.getElementById('lenVal');
        const loss = document.getElementById('loss');
        const lossVal = document.getElementById('lossVal');
        const xtalk = document.getElementById('xtalk');
        const xtalkVal = document.getElementById('xtalkVal');
        const jitter = document.getElementById('jitter');
        const jitterVal = document.getElementById('jitterVal');
        const ctle = document.getElementById('ctle');
        const ctleVal = document.getElementById('ctleVal');

        baud.addEventListener('input', () => { baudVal.textContent = baud.value; simulate(); });
        length.addEventListener('input', () => { lenVal.textContent = length.value; simulate(); });
        loss.addEventListener('input', () => { lossVal.textContent = loss.value; simulate(); });
        xtalk.addEventListener('input', () => { xtalkVal.textContent = xtalk.value; simulate(); });
        jitter.addEventListener('input', () => { jitterVal.textContent = jitter.value; simulate(); });
        ctle.addEventListener('input', () => { ctleVal.textContent = ctle.value; simulate(); });
        document.getElementById('signaling').addEventListener('change', simulate);
        document.getElementById('txTaps').addEventListener('change', simulate);
        document.getElementById('dfeTaps').addEventListener('change', simulate);

        function simulate() {
            const baudRate = parseFloat(baud.value);
            const channelLoss = parseFloat(loss.value);
            const ctleGain = parseFloat(ctle.value);
            const signaling = document.getElementById('signaling').value;
            const isPam4 = signaling === 'pam4';
            const jitterPs = parseFloat(jitter.value);

            // Calculate eye metrics
            const effectiveLoss = channelLoss - ctleGain;
            const eyeHeightBase = isPam4 ? 0.15 : 0.4;
            const eyeH = eyeHeightBase * Math.pow(10, -effectiveLoss / 40);
            const eyeW = 0.9 - jitterPs * 0.05 - effectiveLoss * 0.01;
            const berExp = Math.max(-15, -12 + effectiveLoss * 0.3 - ctleGain * 0.2);
            const margin = 20 - effectiveLoss;

            document.getElementById('eyeHeight').textContent = eyeH.toFixed(3);
            document.getElementById('eyeWidth').textContent = eyeW.toFixed(2) + ' UI';
            document.getElementById('ber').textContent = '1e' + Math.round(berExp);
            document.getElementById('margin').textContent = margin.toFixed(1) + ' dB';

            // Generate eye diagram
            const traces = [];
            const numTraces = 200;
            const levels = isPam4 ? [-1, -1/3, 1/3, 1] : [-1, 1];

            for (let i = 0; i < numTraces; i++) {
                const t = [];
                const y = [];
                const startLevel = levels[Math.floor(Math.random() * levels.length)];
                const endLevel = levels[Math.floor(Math.random() * levels.length)];

                for (let x = -0.5; x <= 1.5; x += 0.01) {
                    t.push(x);
                    // Transition with loss-dependent rise time
                    const riseTime = 0.1 + effectiveLoss * 0.01;
                    let signal;
                    if (x < 0) {
                        signal = startLevel;
                    } else if (x < riseTime) {
                        signal = startLevel + (endLevel - startLevel) * (x / riseTime);
                    } else if (x < 1) {
                        signal = endLevel;
                    } else if (x < 1 + riseTime) {
                        const nextLevel = levels[Math.floor(Math.random() * levels.length)];
                        signal = endLevel + (nextLevel - endLevel) * ((x - 1) / riseTime);
                    } else {
                        signal = levels[Math.floor(Math.random() * levels.length)];
                    }
                    // Add noise and ISI
                    const noise = (Math.random() - 0.5) * (1 - eyeH) * 0.5;
                    const jitterOffset = (Math.random() - 0.5) * jitterPs * 0.02;
                    y.push(signal * eyeH + noise);
                }

                traces.push({
                    x: t,
                    y: y,
                    mode: 'lines',
                    line: { color: '#06b6d4', width: 0.5 },
                    opacity: 0.3,
                    showlegend: false
                });
            }

            // Draw eye mask
            if (isPam4) {
                for (let level = 0; level < 3; level++) {
                    const yCenter = -2/3 + level * 2/3;
                    traces.push({
                        x: [0.2, 0.5, 0.8, 0.5, 0.2],
                        y: [yCenter, yCenter + eyeH * 0.3, yCenter, yCenter - eyeH * 0.3, yCenter].map(v => v * eyeH),
                        mode: 'lines',
                        line: { color: '#ef4444', width: 2 },
                        fill: 'toself',
                        fillcolor: 'rgba(239, 68, 68, 0.1)',
                        showlegend: false
                    });
                }
            } else {
                traces.push({
                    x: [0.15, 0.5, 0.85, 0.5, 0.15],
                    y: [0, eyeH * 0.4, 0, -eyeH * 0.4, 0],
                    mode: 'lines',
                    line: { color: '#ef4444', width: 2 },
                    fill: 'toself',
                    fillcolor: 'rgba(239, 68, 68, 0.1)',
                    showlegend: false
                });
            }

            Plotly.newPlot('eyeDiagram', traces, {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' },
                margin: { l: 50, r: 20, t: 10, b: 40 },
                xaxis: { title: 'Time (UI)', gridcolor: '#374151', range: [-0.5, 1.5] },
                yaxis: { title: 'Voltage', gridcolor: '#374151' }
            }, { responsive: true });

            // Channel response
            const freq = [];
            const response = [];
            const nyquist = baudRate / 2;

            for (let f = 0; f <= nyquist * 2; f += 0.5) {
                freq.push(f);
                const attn = -channelLoss * Math.sqrt(f / nyquist);
                response.push(attn);
            }

            Plotly.newPlot('channelResponse', [
                { x: freq, y: response, name: 'Channel', line: { color: '#ef4444' } },
                { x: freq, y: response.map(r => r + ctleGain * Math.sqrt(freq[response.indexOf(r)] / nyquist)), name: 'With CTLE', line: { color: '#10b981' } }
            ], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' },
                margin: { l: 50, r: 20, t: 10, b: 40 },
                xaxis: { title: 'Frequency (GHz)', gridcolor: '#374151' },
                yaxis: { title: 'Loss (dB)', gridcolor: '#374151' },
                legend: { orientation: 'h', y: -0.2 }
            }, { responsive: true });

            // Pulse response
            const time = [];
            const pulse = [];
            const UI = 1 / baudRate;

            for (let t = -2; t <= 5; t += 0.05) {
                time.push(t);
                // Simple pulse with ISI
                let p = 0;
                if (t >= 0 && t < 1) {
                    p = 1 - Math.exp(-t * 5 / (1 + effectiveLoss * 0.1));
                } else if (t >= 1) {
                    p = Math.exp(-(t - 1) * 3 / (1 + effectiveLoss * 0.1));
                }
                pulse.push(p);
            }

            Plotly.newPlot('pulseResponse', [{
                x: time,
                y: pulse,
                type: 'scatter',
                line: { color: '#f59e0b' },
                fill: 'tozeroy',
                fillcolor: 'rgba(245, 158, 11, 0.2)'
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' },
                margin: { l: 50, r: 20, t: 10, b: 40 },
                xaxis: { title: 'Time (UI)', gridcolor: '#374151' },
                yaxis: { title: 'Amplitude', gridcolor: '#374151' }
            }, { responsive: true });

            // Bathtub curve
            const position = [];
            const ber = [];

            for (let x = 0; x <= 1; x += 0.02) {
                position.push(x);
                const distFromCenter = Math.abs(x - 0.5);
                const berVal = Math.pow(10, berExp + distFromCenter * 20);
                ber.push(Math.log10(Math.min(berVal, 1)));
            }

            Plotly.newPlot('bathtub', [{
                x: position,
                y: ber,
                type: 'scatter',
                line: { color: '#8b5cf6' },
                fill: 'tozeroy',
                fillcolor: 'rgba(139, 92, 246, 0.2)'
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' },
                margin: { l: 50, r: 20, t: 10, b: 40 },
                xaxis: { title: 'Sampling Position (UI)', gridcolor: '#374151' },
                yaxis: { title: 'log₁₀(BER)', gridcolor: '#374151' },
                shapes: [{
                    type: 'line', x0: 0, x1: 1, y0: -12, y1: -12,
                    line: { color: '#ef4444', dash: 'dash' }
                }]
            }, { responsive: true });
        }

        simulate();
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
