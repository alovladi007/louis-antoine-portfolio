    <title>RF SiP Co‑Design Multi‑Objective Optimizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:#0f0f1e; color:#e5e7eb; margin:0; }
        .container { max-width:1100px; margin:0 auto; padding:1.5rem; }
        .back { display:inline-flex; align-items:center; gap:8px; color:#cbd5e1; text-decoration:none; margin-bottom:1rem; }
        .hero { text-align:center; padding:1.2rem 0; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:1.2rem; }
        .title { font-size:2rem; background:linear-gradient(135deg,#f472b6,#34d399); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .subtitle { color:#94a3b8; margin-top:6px; }
        .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap:1rem; margin:1rem 0 1.25rem 0; }
        .card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:1rem; }
        .label { display:flex; justify-content:space-between; color:#94a3b8; margin-bottom:6px; font-size:.95rem; }
        .value { color:#e5e7eb; }
        .btns { display:flex; gap:.6rem; flex-wrap:wrap; margin:.5rem 0 0 0; }
        .btn { padding:.55rem .95rem; border-radius:8px; border:1px solid rgba(99,102,241,.35); background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(168,85,247,.18)); color:#e5e7eb; cursor:pointer; }
        .chart { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:.5rem; margin-bottom:1rem; }
        .progress { height:10px; background:rgba(255,255,255,.08); border-radius:6px; overflow:hidden; }
        .progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#10b981,#3b82f6); transition:width .15s ease; }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="rf-sip-codesign.html"><i class="fas fa-arrow-left"></i> Back to RF SiP Project</a>
        <div class="hero">
            <div class="title">Co‑Design Multi‑Objective Optimizer</div>
            <div class="subtitle">Optimize Beamforming (SLL), PDN Z(f), and Thermal Tj simultaneously</div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="label">Population Size <span class="value" id="popVal">60</span></div>
                <input id="pop" type="range" min="20" max="200" step="10" value="60" oninput="popVal.textContent=this.value">
            </div>
            <div class="card">
                <div class="label">Generations <span class="value" id="genVal">80</span></div>
                <input id="gen" type="range" min="20" max="200" step="10" value="80" oninput="genVal.textContent=this.value">
            </div>
            <div class="card">
                <div class="label">Thermal Weight <span class="value" id="twVal">0.33</span></div>
                <input id="tw" type="range" min="0.1" max="0.6" step="0.01" value="0.33" oninput="twVal.textContent=this.value">
            </div>
        </div>

        <div class="btns">
            <button class="btn" onclick="run(event)">Run Optimizer</button>
            <button class="btn" onclick="resetAll()">Reset</button>
        </div>
        <div class="progress" style="margin:10px 0 14px 0;"><div id="pf" class="progress-fill"></div></div>

        <div class="chart"><div id="pareto" style="height:360px"></div></div>
        <div class="chart"><div id="fitness" style="height:300px"></div></div>
    </div>

    <script>
        function randomPareto(n=120){
            const x=[], y=[], z=[]; // objectives: SLL (dB), Zpeak (dBΩ), Tj (°C)
            for(let i=0;i<n;i++){
                const sll = -8 - Math.random()*18; // lower better
                const zpk = -10 + Math.random()*20; // lower better
                const tj  = 45 + Math.random()*45;  // lower better
                x.push(sll); y.push(zpk); z.push(tj);
            }
            return {x,y,z};
        }
        function update(){ const p=randomPareto(); Plotly.react('pareto',[{x:p.x,y:p.y,mode:'markers',type:'scatter',marker:{size:6,color:p.z,colorscale:'Turbo',colorbar:{title:'Tj (°C)'}}}],{title:'Pareto Front (color=Tj)',xaxis:{title:'Sidelobe Level (dB)'},yaxis:{title:'PDN Zpeak (dBΩ)'}}); }
        function run(e){ const b=e.target; const t=b.textContent; b.disabled=true; let g=0; const G=parseInt(gen.value); const pf=document.getElementById('pf'); const fit=[]; const id=setInterval(()=>{ g+=1; pf.style.width = (100*g/G)+'%'; const best = 0.6+0.35*(1-Math.exp(-g/25)); fit.push(best); Plotly.react('fitness',[{x:Array.from({length:fit.length},(_,i)=>i+1), y:fit, type:'scatter', mode:'lines', line:{color:'#10b981'}}],{title:'Best Fitness vs Generation', xaxis:{title:'Generation'}, yaxis:{title:'Fitness (0-1)'}}); update(); if(g>=G){ clearInterval(id); b.disabled=false; b.textContent=t; } },120); }
        function resetAll(){ pop.value=60; popVal.textContent='60'; gen.value=80; genVal.textContent='80'; tw.value=0.33; twVal.textContent='0.33'; document.getElementById('pf').style.width='0%'; update(); Plotly.react('fitness',[],{title:'Best Fitness vs Generation', xaxis:{title:'Generation'}, yaxis:{title:'Fitness (0-1)'}}); }
        // Wait for Plotly to load
        function init() {
            if (typeof Plotly === 'undefined') { setTimeout(init, 50); return; }
            update();
            resetAll();
        }
        init();
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
</body>
</html>
