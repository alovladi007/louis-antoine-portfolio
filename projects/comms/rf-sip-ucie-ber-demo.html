    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:#0f0f1e; color:#e5e7eb; margin:0; }
        .container { max-width:1100px; margin:0 auto; padding:1.5rem; }
        .back { display:inline-flex; align-items:center; gap:8px; color:#cbd5e1; text-decoration:none; margin-bottom:1rem; }
        .hero { text-align:center; padding:1.2rem 0; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:1.2rem; }
        .title { font-size:2rem; background:linear-gradient(135deg,#818cf8,#22d3ee); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .subtitle { color:#94a3b8; margin-top:6px; }

        .value { color:#e5e7eb; }

        .btn { padding:.55rem .95rem; border-radius:8px; border:1px solid rgba(99,102,241,.35); background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(168,85,247,.18)); color:#e5e7eb; cursor:pointer; }
        .chart { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:.5rem; margin-bottom:1rem; }

<body>
    <a href="#content" class="skip-link" style="position:absolute;top:-100px;left:0;z-index:10000;padding:.75rem 1.5rem;background:#1f2937;color:#fff;text-decoration:none;border-radius:0 0 8px 0;font-weight:600;transition:top .2s" onfocus="this.style.top='0'" onblur="this.style.top='-100px'">Skip to main content</a>

    <div class="container">
        <a class="back" href="rf-sip-codesign.html"><i class="fas fa-arrow-left"></i> Back to RF SiP Project</a>
        <div class="hero">
            <div class="title">UCIe SI/BER & Eye Diagram</div>
            <div class="subtitle">Data rate • Jitter • Noise • Channel loss</div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="label">Data Rate (Gbps) <span class="value" id="drVal">32</span></div>
                <input id="dr" type="range" min="8" max="64" step="1" value="32" oninput="drVal.textContent=this.value; update()">
            </div>
            <div class="card">
                <div class="label">RJ (ps rms) <span class="value" id="rjVal">0.8</span></div>
                <input id="rj" type="range" min="0.1" max="2.0" step="0.1" value="0.8" oninput="rjVal.textContent=this.value; update()">
            </div>
            <div class="card">
                <div class="label">Noise (mV rms) <span class="value" id="nVal">10</span></div>
                <input id="n" type="range" min="2" max="30" step="1" value="10" oninput="nVal.textContent=this.value; update()">
            </div>
            <div class="card">
                <div class="label">Channel Loss (dB) <span class="value" id="lossVal">12</span></div>
                <input id="loss" type="range" min="4" max="24" step="1" value="12" oninput="lossVal.textContent=this.value; update()">
            </div>
        </div>

        <div class="btns">
            <button class="btn" onclick="run(event)">Run</button>
            <button class="btn" onclick="resetAll()">Reset</button>
        </div>

        <div class="chart"><div id="eyeChart" style="height:360px"></div></div>
        <div class="chart"><div id="berChart" style="height:360px"></div></div>
    </div>

    <script>
        function synthEye(drGbps,rjPs,noiseMv,lossDb){
            const ui=1e3/drGbps; // ps
            const xs=[]; const ys=[]; const N=1800; for(let i=0;i<N;i++){ const t=(i/N)*2*ui; const ideal = (t%ui) < ui/2 ? 1:0; const jitter = rjPs*(Math.random()-0.5); const noise = (noiseMv/1000)*(Math.random()-0.5); const atten = Math.pow(10,-lossDb/20); const y= (ideal*atten) + noise; xs.push((t+jitter)%ui); ys.push(y); }
            return {xs,ys,ui};
        }
        function berCurve(drGbps,rjPs,noiseMv,lossDb){
            const snr = (1/Math.pow(10,lossDb/20)) / (noiseMv/1000 + rjPs/10);
            const x=Array.from({length:41},(_,i)=> i);
            const y=x.map(m => Math.max(1e-12, 0.5*Math.exp(-snr*m*0.35)) );
            return {x,y};
        }
        function update(){ const dr=parseFloat(dr.value), rjp=parseFloat(rj.value), nmv=parseFloat(n.value), ld=parseFloat(loss.value); const e=synthEye(dr,rjp,nmv,ld); Plotly.react('eyeChart',[{x:e.xs,y:e.ys,mode:'markers',type:'scatter',marker:{size:3,color:'#22d3ee',opacity:0.6}}],{title:'Synthetic Eye Diagram',xaxis:{title:'Time within UI (ps)'},yaxis:{title:'V (V)'}}); const b=berCurve(dr,rjp,nmv,ld); Plotly.react('berChart',[{x:b.x,y:b.y,type:'scatter',mode:'lines',line:{color:'#a78bfa'}}],{title:'Relative BER vs Margin',yaxis:{type:'log',title:'BER (rel.)'},xaxis:{title:'Margin units'}}); }
        function run(e){ const b=e.target,t=b.textContent; b.disabled=true; let p=0; const id=setInterval(()=>{ p+=12; b.textContent=`Running... ${Math.min(100,p)}%`; rj.value=Math.max(0.1,Math.min(2.0, parseFloat(rj.value)+(Math.random()-0.5)*0.1)); rjVal.textContent=rj.value; update(); if(p>=100){ clearInterval(id); b.disabled=false; b.textContent=t; } },140); }
        function resetAll(){ dr.value=32; drVal.textContent='32'; rj.value=0.8; rjVal.textContent='0.8'; n.value=10; nVal.textContent='10'; loss.value=12; lossVal.textContent='12'; update(); }
        // Wait for Plotly to load
        function init() {
            if (typeof Plotly === 'undefined') { setTimeout(init, 50); return; }
            update();
        }
        init();
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
</body>
</html>
