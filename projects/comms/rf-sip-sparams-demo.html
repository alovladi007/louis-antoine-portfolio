<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RF SiP S-Parameters Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #0f0f1e; color: #e5e7eb; margin:0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
        .back { display:inline-flex; align-items:center; gap:8px; color:#cbd5e1; text-decoration:none; margin-bottom:1rem; }
        .hero { text-align:center; padding:1.5rem 0; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:1.5rem; }
        .title { font-size: 2rem; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color:#94a3b8; margin-top:6px; }
        .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap:1rem; margin:1rem 0 1.25rem 0; }
        .card { background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:1rem; }
        .label { display:flex; justify-content:space-between; color:#94a3b8; margin-bottom:6px; font-size:0.95rem; }
        .value { color:#e5e7eb; }
        .btns { display:flex; gap:.6rem; flex-wrap:wrap; margin:.5rem 0 0 0; }
        .btn { padding:.55rem .95rem; border-radius:8px; border:1px solid rgba(99,102,241,.35); background: linear-gradient(135deg, rgba(99,102,241,.18), rgba(168,85,247,.18)); color:#e5e7eb; cursor:pointer; }
        .chart { background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="rf-sip-codesign.html"><i class="fas fa-arrow-left"></i> Back to RF SiP Project</a>
        <div class="hero">
            <div class="title">S‑Parameter Sweep Demo</div>
            <div class="subtitle">Package Transition Sensitivity • S11/S21 vs Frequency • Via Diameter</div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="label">Start Freq (GHz) <span class="value" id="fsVal">24</span></div>
                <input id="fs" type="range" min="20" max="30" step="0.5" value="24" oninput="fsVal.textContent=this.value; update()">
            </div>
            <div class="card">
                <div class="label">Stop Freq (GHz) <span class="value" id="feVal">32</span></div>
                <input id="fe" type="range" min="30" max="40" step="0.5" value="32" oninput="feVal.textContent=this.value; update()">
            </div>
            <div class="card">
                <div class="label">Via Diameter (μm) <span class="value" id="vdVal">50</span></div>
                <input id="vd" type="range" min="30" max="80" step="1" value="50" oninput="vdVal.textContent=this.value; update()">
            </div>
        </div>

        <div class="btns">
            <button class="btn" onclick="run(event)">Run</button>
            <button class="btn" onclick="resetAll()">Reset</button>
        </div>

        <div class="chart"><div id="chart" style="height:420px"></div></div>
    </div>

    <script>
        function synth(fs,fe,vd){ const f=[],s11=[],s21=[]; const N=161; for(let i=0;i<N;i++){ const x=fs+(fe-fs)*i/(N-1); const notch=28+(vd-50)*0.03; const s11db=-10-10*Math.exp(-Math.pow((x-notch)/1.8,2)); const s21db=-0.5-1.5*Math.exp(-Math.pow((x-notch)/2.0,2)); f.push(x); s11.push(s11db); s21.push(s21db);} return {f,s11,s21}; }
        function update(){ const fs=parseFloat(document.getElementById('fs').value); const fe=parseFloat(document.getElementById('fe').value); const vd=parseFloat(document.getElementById('vd').value); const {f,s11,s21}=synth(fs,fe,vd); Plotly.react('chart',[{x:f,y:s11,type:'scatter',mode:'lines',name:'S11 (dB)',line:{color:'#f472b6'}},{x:f,y:s21,type:'scatter',mode:'lines',name:'S21 (dB)',line:{color:'#60a5fa'}}],{title:'S‑Parameters vs Frequency',xaxis:{title:'Freq (GHz)'},yaxis:{title:'Magnitude (dB)'}}); }
        function run(e){ const b=e.target, t=b.textContent; b.disabled=true; let p=0; const id=setInterval(()=>{ p+=15; b.textContent=`Running... ${Math.min(100,p)}%`; const base=parseFloat(vd.value); vd.value=Math.max(30,Math.min(80,base+(Math.random()-0.5)*2)); vdVal.textContent=vd.value; update(); if(p>=100){ clearInterval(id); b.disabled=false; b.textContent=t; } },150); }
        function resetAll(){ fs.value=24; fsVal.textContent='24'; fe.value=32; feVal.textContent='32'; vd.value=50; vdVal.textContent='50'; update(); }
        // Wait for Plotly to load
        function init() {
            if (typeof Plotly === 'undefined') { setTimeout(init, 50); return; }
            update();
        }
        init();
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
</body>
</html>
