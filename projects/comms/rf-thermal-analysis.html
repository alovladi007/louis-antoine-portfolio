<body class="bg-gray-900 text-white min-h-screen">
    <nav class="bg-gray-900/95 backdrop-blur-sm border-b border-cyan-500/20 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="rf-sip-codesign.html" class="flex items-center text-cyan-400 hover:text-cyan-300">
                    <i class="fas fa-arrow-left mr-2"></i>Back to RF/SiP Co-Design
                </a>
                <span class="text-cyan-400 font-semibold">Thermal Analysis</span>
            </div>
        </div>
    </nav>

    <section class="gradient-bg py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4"><i class="fas fa-temperature-high mr-4"></i>Thermal Analysis</h1>
            <p class="text-xl text-cyan-100">Package thermal simulation and junction temperature mapping</p>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid lg:grid-cols-4 gap-6">
            <div class="space-y-6">
                <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                    <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-fire mr-2"></i>Power Dissipation</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Die Power: <span id="diePowerVal">15</span> W</label>
                            <input type="range" id="diePower" min="1" max="50" value="15" class="w-full accent-cyan-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">PA Power: <span id="paPowerVal">5</span> W</label>
                            <input type="range" id="paPower" min="0" max="20" value="5" class="w-full accent-cyan-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">SerDes Power: <span id="serdesPowerVal">3</span> W</label>
                            <input type="range" id="serdesPower" min="0" max="10" value="3" class="w-full accent-cyan-500">
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                    <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-wind mr-2"></i>Cooling</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Ambient Temp: <span id="ambientVal">25</span> °C</label>
                            <input type="range" id="ambient" min="0" max="85" value="25" class="w-full accent-cyan-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Heatsink Type</label>
                            <select id="heatsink" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                                <option value="none">None (Natural)</option>
                                <option value="small">Small Heatsink</option>
                                <option value="medium" selected>Medium Heatsink</option>
                                <option value="large">Large Heatsink</option>
                                <option value="active">Active Cooling</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">TIM Conductivity: <span id="timVal">5</span> W/mK</label>
                            <input type="range" id="tim" min="1" max="20" value="5" class="w-full accent-cyan-500">
                        </div>
                    </div>
                    <button onclick="simulate()" class="w-full mt-4 bg-cyan-600 hover:bg-cyan-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors">
                        <i class="fas fa-thermometer-half mr-2"></i>Simulate
                    </button>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">
                <div class="grid md:grid-cols-4 gap-4">
                    <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-4 text-center">
                        <div class="text-3xl font-bold" id="tjunction">85°C</div>
                        <div class="text-sm text-gray-400">T<sub>junction</sub></div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-4 text-center">
                        <div class="text-3xl font-bold text-green-400" id="tcase">65°C</div>
                        <div class="text-sm text-gray-400">T<sub>case</sub></div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-4 text-center">
                        <div class="text-3xl font-bold text-purple-400" id="thetaJA">2.5°C/W</div>
                        <div class="text-sm text-gray-400">θ<sub>JA</sub></div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-4 text-center">
                        <div class="text-3xl font-bold text-amber-400" id="margin">PASS</div>
                        <div class="text-sm text-gray-400">Tj < 105°C</div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                    <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-th mr-2"></i>Temperature Map</h3>
                    <div id="heatmap" style="height: 400px;"></div>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                        <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-layer-group mr-2"></i>Thermal Stack</h3>
                        <div id="thermalStack" class="space-y-2"></div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                        <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-chart-line mr-2"></i>Temperature Profile</h3>
                        <div id="profileChart" style="height: 280px;"></div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-cyan-500/30 p-6">
                    <h3 class="text-lg font-semibold text-cyan-400 mb-4"><i class="fas fa-clock mr-2"></i>Transient Response</h3>
                    <div id="transientChart" style="height: 250px;"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const diePower = document.getElementById('diePower');
        const diePowerVal = document.getElementById('diePowerVal');
        const paPower = document.getElementById('paPower');
        const paPowerVal = document.getElementById('paPowerVal');
        const serdesPower = document.getElementById('serdesPower');
        const serdesPowerVal = document.getElementById('serdesPowerVal');
        const ambient = document.getElementById('ambient');
        const ambientVal = document.getElementById('ambientVal');
        const tim = document.getElementById('tim');
        const timVal = document.getElementById('timVal');

        diePower.addEventListener('input', () => { diePowerVal.textContent = diePower.value; simulate(); });
        paPower.addEventListener('input', () => { paPowerVal.textContent = paPower.value; simulate(); });
        serdesPower.addEventListener('input', () => { serdesPowerVal.textContent = serdesPower.value; simulate(); });
        ambient.addEventListener('input', () => { ambientVal.textContent = ambient.value; simulate(); });
        tim.addEventListener('input', () => { timVal.textContent = tim.value; simulate(); });
        document.getElementById('heatsink').addEventListener('change', simulate);

        function simulate() {
            const Pdie = parseFloat(diePower.value);
            const Ppa = parseFloat(paPower.value);
            const Pserdes = parseFloat(serdesPower.value);
            const Ptotal = Pdie + Ppa + Pserdes;
            const Tamb = parseFloat(ambient.value);
            const kTIM = parseFloat(tim.value);
            const heatsink = document.getElementById('heatsink').value;

            // Thermal resistances
            const thetaJC = 0.5; // Junction to case
            const thetaTIM = 0.1 / kTIM * 5; // TIM layer

            let thetaHS;
            switch(heatsink) {
                case 'none': thetaHS = 15; break;
                case 'small': thetaHS = 5; break;
                case 'medium': thetaHS = 2; break;
                case 'large': thetaHS = 1; break;
                case 'active': thetaHS = 0.3; break;
            }

            const thetaJA = thetaJC + thetaTIM + thetaHS;
            const Tj = Tamb + Ptotal * thetaJA;
            const Tcase = Tamb + Ptotal * (thetaTIM + thetaHS);

            const pass = Tj < 105;

            document.getElementById('tjunction').textContent = Tj.toFixed(0) + '°C';
            document.getElementById('tjunction').className = `text-3xl font-bold ${Tj > 100 ? 'text-red-400' : Tj > 85 ? 'text-amber-400' : 'text-cyan-400'}`;
            document.getElementById('tcase').textContent = Tcase.toFixed(0) + '°C';
            document.getElementById('thetaJA').textContent = thetaJA.toFixed(2) + '°C/W';
            document.getElementById('margin').textContent = pass ? 'PASS' : 'FAIL';
            document.getElementById('margin').className = `text-3xl font-bold ${pass ? 'text-green-400' : 'text-red-400'}`;

            // Generate heatmap
            const size = 20;
            const z = [];
            for (let i = 0; i < size; i++) {
                const row = [];
                for (let j = 0; j < size; j++) {
                    // Die in center
                    const cx = size / 2, cy = size / 2;
                    const dist = Math.sqrt((i - cx) ** 2 + (j - cy) ** 2);

                    // Base temperature
                    let temp = Tamb + 5;

                    // Die heat
                    if (dist < 4) {
                        temp = Tj - (Tj - Tcase) * dist / 4;
                    } else if (dist < 8) {
                        temp = Tcase - (Tcase - Tamb - 10) * (dist - 4) / 4;
                    }

                    // PA hotspot
                    const paDist = Math.sqrt((i - 3) ** 2 + (j - 3) ** 2);
                    if (paDist < 2) {
                        temp = Math.max(temp, Tamb + Ppa * 5);
                    }

                    // SerDes hotspots
                    const serdesDist = Math.sqrt((i - 16) ** 2 + (j - 10) ** 2);
                    if (serdesDist < 2) {
                        temp = Math.max(temp, Tamb + Pserdes * 4);
                    }

                    row.push(temp);
                }
                z.push(row);
            }

            Plotly.newPlot('heatmap', [{
                z: z,
                type: 'heatmap',
                colorscale: [
                    [0, '#06b6d4'],
                    [0.3, '#10b981'],
                    [0.5, '#fbbf24'],
                    [0.7, '#f97316'],
                    [1, '#ef4444']
                ],
                colorbar: { title: '°C', tickfont: { color: '#fff' } }
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' },
                margin: { l: 50, r: 20, t: 20, b: 50 },
                xaxis: { title: 'X (mm)', gridcolor: '#374151' },
                yaxis: { title: 'Y (mm)', gridcolor: '#374151' },
                annotations: [
                    { x: 10, y: 10, text: 'Die', showarrow: false, font: { color: '#fff', size: 14 } },
                    { x: 3, y: 3, text: 'PA', showarrow: false, font: { color: '#fff', size: 12 } },
                    { x: 16, y: 10, text: 'SerDes', showarrow: false, font: { color: '#fff', size: 12 } }
                ]
            }, { responsive: true });

            // Thermal stack visualization
            const stack = document.getElementById('thermalStack');
            const layers = [
                { name: 'Junction', temp: Tj, theta: '-', color: 'red' },
                { name: 'Die', temp: Tj - Pdie * 0.1, theta: '0.1°C/W', color: 'orange' },
                { name: 'Die Attach', temp: Tj - Pdie * 0.2, theta: '0.1°C/W', color: 'amber' },
                { name: 'Substrate', temp: Tcase + 5, theta: '0.2°C/W', color: 'yellow' },
                { name: 'TIM', temp: Tcase, theta: thetaTIM.toFixed(2) + '°C/W', color: 'green' },
                { name: 'Heatsink', temp: Tamb + 10, theta: thetaHS.toFixed(2) + '°C/W', color: 'cyan' },
                { name: 'Ambient', temp: Tamb, theta: '-', color: 'blue' }
            ];

            stack.innerHTML = layers.map(l => `
                <div class="flex items-center justify-between p-2 rounded bg-${l.color}-600/20 border border-${l.color}-500/30">
                    <span class="font-medium">${l.name}</span>
                    <div class="flex gap-4 text-sm">
                        <span class="text-gray-400">θ: ${l.theta}</span>
                        <span class="font-bold">${l.temp.toFixed(1)}°C</span>
                    </div>
                </div>
            `).join('');

            // Profile chart
            const positions = ['Junction', 'Die', 'Attach', 'Substrate', 'TIM', 'Heatsink', 'Ambient'];
            const temps = layers.map(l => l.temp);

            Plotly.newPlot('profileChart', [{
                x: positions,
                y: temps,
                type: 'scatter',
                mode: 'lines+markers',
                line: { color: '#f59e0b', width: 3 },
                marker: { size: 10 },
                fill: 'tozeroy',
                fillcolor: 'rgba(245, 158, 11, 0.2)'
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' },
                margin: { l: 50, r: 20, t: 10, b: 80 },
                xaxis: { gridcolor: '#374151', tickangle: -45 },
                yaxis: { title: 'Temperature (°C)', gridcolor: '#374151' }
            }, { responsive: true });

            // Transient response
            const time = [];
            const tempTransient = [];
            const tau = 5; // Thermal time constant

            for (let t = 0; t <= 60; t += 0.5) {
                time.push(t);
                const temp = Tamb + (Tj - Tamb) * (1 - Math.exp(-t / tau));
                tempTransient.push(temp);
            }

            Plotly.newPlot('transientChart', [{
                x: time,
                y: tempTransient,
                type: 'scatter',
                line: { color: '#06b6d4' },
                fill: 'tozeroy',
                fillcolor: 'rgba(6, 182, 212, 0.2)'
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' },
                margin: { l: 50, r: 20, t: 10, b: 40 },
                xaxis: { title: 'Time (s)', gridcolor: '#374151' },
                yaxis: { title: 'Junction Temperature (°C)', gridcolor: '#374151' },
                shapes: [{
                    type: 'line', x0: 0, x1: 60, y0: 105, y1: 105,
                    line: { color: '#ef4444', dash: 'dash' }
                }]
            }, { responsive: true });
        }

        simulate();
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
</body>
