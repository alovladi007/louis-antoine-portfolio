<!DOCTYPE html>
<html lang="en">
<head>
    <!-- SEO + OG (auto-injected by scripts/inject-meta-tags.py) -->
    <meta name="description" content="Config Generator - Distributed ML — part of the engineering portfolio of Louis Vladimir Antoine, covering hardware, semiconductors, photonics, and software systems.">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config Generator - Distributed ML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.gradient-bg { background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #fcd34d 100%); }</style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <a href="#content" class="skip-link" style="position:absolute;top:-100px;left:0;z-index:10000;padding:.75rem 1.5rem;background:#1f2937;color:#fff;text-decoration:none;border-radius:0 0 8px 0;font-weight:600;transition:top .2s" onfocus="this.style.top='0'" onblur="this.style.top='-100px'">Skip to main content</a>

    <nav class="bg-gray-900/95 backdrop-blur-sm border-b border-amber-500/20 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="distributed-ml-complete-project.html" class="flex items-center text-amber-400 hover:text-amber-300">
                    <i class="fas fa-arrow-left mr-2"></i>Back to Distributed ML
                </a>
                <span class="text-amber-400 font-semibold">Config Generator</span>
            </div>
        </div>
    </nav>

    <section class="gradient-bg py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4 text-gray-900"><i class="fas fa-cogs mr-4"></i>Config Generator</h1>
            <p class="text-xl text-amber-900">Generate DDP, FSDP, and DeepSpeed configurations</p>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid lg:grid-cols-2 gap-8">
            <div class="space-y-6">
                <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-6">
                    <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-layer-group mr-2"></i>Framework</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="selectFramework('ddp')" class="py-3 px-4 rounded-lg bg-amber-600 text-white font-semibold framework-btn" id="btn-ddp">DDP</button>
                        <button onclick="selectFramework('fsdp')" class="py-3 px-4 rounded-lg bg-gray-700 text-white font-semibold framework-btn" id="btn-fsdp">FSDP</button>
                        <button onclick="selectFramework('deepspeed')" class="py-3 px-4 rounded-lg bg-gray-700 text-white font-semibold framework-btn" id="btn-deepspeed">DeepSpeed</button>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-6">
                    <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-server mr-2"></i>Cluster</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Nodes</label>
                            <select id="nodes" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                                <option value="1" selected>1 Node</option>
                                <option value="2">2 Nodes</option>
                                <option value="4">4 Nodes</option>
                                <option value="8">8 Nodes</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">GPUs per Node</label>
                            <select id="gpusPerNode" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                                <option value="1">1 GPU</option>
                                <option value="2">2 GPUs</option>
                                <option value="4">4 GPUs</option>
                                <option value="8" selected>8 GPUs</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">GPU Type</label>
                            <select id="gpuType" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                                <option value="a100-40">A100-40GB</option>
                                <option value="a100-80" selected>A100-80GB</option>
                                <option value="h100">H100-80GB</option>
                                <option value="v100">V100-32GB</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-6" id="frameworkOptions">
                    <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-sliders-h mr-2"></i>Options</h3>
                    <div class="space-y-4" id="optionsContainer"></div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-6">
                    <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-graduation-cap mr-2"></i>Training</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Batch Size / GPU</label>
                            <input type="number" id="batchSize" value="4" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Gradient Accumulation</label>
                            <input type="number" id="gradAccum" value="4" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="mixedPrecision" checked class="accent-amber-500">
                            <label for="mixedPrecision">Mixed Precision (FP16/BF16)</label>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="gradCheckpoint" class="accent-amber-500">
                            <label for="gradCheckpoint">Gradient Checkpointing</label>
                        </div>
                    </div>
                </div>

                <button onclick="generateConfig()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors">
                    <i class="fas fa-magic mr-2"></i>Generate Config
                </button>
            </div>

            <div class="space-y-6">
                <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold text-amber-400"><i class="fas fa-code mr-2"></i>Generated Configuration</h3>
                        <button onclick="copyConfig()" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm">
                            <i class="fas fa-copy mr-1"></i>Copy
                        </button>
                    </div>
                    <pre class="bg-gray-900 rounded-lg p-4 text-sm overflow-x-auto max-h-96" id="configOutput"><code class="text-green-400"></code></pre>
                </div>

                <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-6">
                    <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-terminal mr-2"></i>Launch Command</h3>
                    <pre class="bg-gray-900 rounded-lg p-4 text-sm overflow-x-auto" id="launchCmd"><code class="text-cyan-400"></code></pre>
                </div>

                <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-6">
                    <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-info-circle mr-2"></i>Configuration Summary</h3>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div class="flex justify-between"><span class="text-gray-400">Total GPUs:</span><span id="totalGpus">8</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">World Size:</span><span id="worldSize">8</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">Global Batch:</span><span id="globalBatch">128</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">Effective Batch:</span><span id="effectiveBatch">512</span></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentFramework = 'ddp';

        const frameworkOptions = {
            ddp: `
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Backend</label>
                    <select id="backend" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                        <option value="nccl" selected>NCCL</option>
                        <option value="gloo">Gloo</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="findUnused" class="accent-amber-500">
                    <label for="findUnused">Find Unused Parameters</label>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="staticGraph" class="accent-amber-500">
                    <label for="staticGraph">Static Graph Optimization</label>
                </div>
            `,
            fsdp: `
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Sharding Strategy</label>
                    <select id="shardStrategy" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                        <option value="full_shard" selected>Full Shard (ZeRO-3)</option>
                        <option value="shard_grad_op">Shard Grad Op (ZeRO-2)</option>
                        <option value="no_shard">No Shard (DDP)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">CPU Offload</label>
                    <select id="cpuOffload" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                        <option value="none" selected>None</option>
                        <option value="params">Parameters</option>
                        <option value="all">Full Offload</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="autoWrap" checked class="accent-amber-500">
                    <label for="autoWrap">Auto Wrap Transformer Layers</label>
                </div>
            `,
            deepspeed: `
                <div>
                    <label class="block text-sm text-gray-300 mb-1">ZeRO Stage</label>
                    <select id="zeroStage" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                        <option value="0">Stage 0 (DDP)</option>
                        <option value="1">Stage 1 (Optimizer)</option>
                        <option value="2" selected>Stage 2 (+ Gradients)</option>
                        <option value="3">Stage 3 (+ Parameters)</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="offloadOptimizer" class="accent-amber-500">
                    <label for="offloadOptimizer">Offload Optimizer to CPU</label>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="offloadParams" class="accent-amber-500">
                    <label for="offloadParams">Offload Parameters to CPU</label>
                </div>
            `
        };

        function selectFramework(framework) {
            currentFramework = framework;
            document.querySelectorAll('.framework-btn').forEach(btn => {
                btn.classList.remove('bg-amber-600');
                btn.classList.add('bg-gray-700');
            });
            document.getElementById(`btn-${framework}`).classList.remove('bg-gray-700');
            document.getElementById(`btn-${framework}`).classList.add('bg-amber-600');
            document.getElementById('optionsContainer').innerHTML = frameworkOptions[framework];
            generateConfig();
        }

        function generateConfig() {
            const nodes = parseInt(document.getElementById('nodes').value);
            const gpusPerNode = parseInt(document.getElementById('gpusPerNode').value);
            const batchSize = parseInt(document.getElementById('batchSize').value);
            const gradAccum = parseInt(document.getElementById('gradAccum').value);
            const mixedPrecision = document.getElementById('mixedPrecision').checked;

            const totalGpus = nodes * gpusPerNode;
            const globalBatch = batchSize * totalGpus;
            const effectiveBatch = globalBatch * gradAccum;

            document.getElementById('totalGpus').textContent = totalGpus;
            document.getElementById('worldSize').textContent = totalGpus;
            document.getElementById('globalBatch').textContent = globalBatch;
            document.getElementById('effectiveBatch').textContent = effectiveBatch;

            let config = '';
            let launchCmd = '';

            if (currentFramework === 'ddp') {
                config = `# PyTorch DDP Configuration
import torch.distributed as dist
from torch.nn.parallel import DistributedDataParallel as DDP

# Initialize process group
dist.init_process_group(
    backend="nccl",
    init_method="env://",
    world_size=${totalGpus},
    rank=int(os.environ["RANK"])
)

# Set device
local_rank = int(os.environ["LOCAL_RANK"])
torch.cuda.set_device(local_rank)

# Wrap model
model = model.to(local_rank)
model = DDP(
    model,
    device_ids=[local_rank],
    output_device=local_rank,
    find_unused_parameters=False,
    static_graph=False
)

# Training config
config = {
    "batch_size": ${batchSize},
    "gradient_accumulation_steps": ${gradAccum},
    "mixed_precision": ${mixedPrecision},
    "world_size": ${totalGpus}
}`;
                launchCmd = `torchrun --nnodes=${nodes} --nproc_per_node=${gpusPerNode} \\
    --rdzv_backend=c10d --rdzv_endpoint=localhost:29500 \\
    train.py`;

            } else if (currentFramework === 'fsdp') {
                const strategy = document.getElementById('shardStrategy')?.value || 'full_shard';
                config = `# PyTorch FSDP Configuration
from torch.distributed.fsdp import (
    FullyShardedDataParallel as FSDP,
    ShardingStrategy,
    CPUOffload,
    MixedPrecision
)
from torch.distributed.fsdp.wrap import transformer_auto_wrap_policy

# Sharding strategy
sharding_strategy = ShardingStrategy.${strategy.toUpperCase()}

# Mixed precision policy
mp_policy = MixedPrecision(
    param_dtype=torch.bfloat16,
    reduce_dtype=torch.bfloat16,
    buffer_dtype=torch.bfloat16
) if ${mixedPrecision} else None

# Wrap model with FSDP
model = FSDP(
    model,
    sharding_strategy=sharding_strategy,
    cpu_offload=None,
    mixed_precision=mp_policy,
    auto_wrap_policy=transformer_auto_wrap_policy,
    device_id=torch.cuda.current_device()
)

# Training config
config = {
    "batch_size": ${batchSize},
    "gradient_accumulation_steps": ${gradAccum},
    "world_size": ${totalGpus},
    "sharding_strategy": "${strategy}"
}`;
                launchCmd = `torchrun --nnodes=${nodes} --nproc_per_node=${gpusPerNode} \\
    --rdzv_backend=c10d --rdzv_endpoint=localhost:29500 \\
    train_fsdp.py`;

            } else if (currentFramework === 'deepspeed') {
                const zeroStage = document.getElementById('zeroStage')?.value || '2';
                config = `{
    "train_batch_size": ${effectiveBatch},
    "train_micro_batch_size_per_gpu": ${batchSize},
    "gradient_accumulation_steps": ${gradAccum},

    "zero_optimization": {
        "stage": ${zeroStage},
        "offload_optimizer": {
            "device": "none"
        },
        "offload_param": {
            "device": "none"
        },
        "overlap_comm": true,
        "contiguous_gradients": true,
        "reduce_bucket_size": 5e8,
        "stage3_prefetch_bucket_size": 5e8,
        "stage3_param_persistence_threshold": 1e6
    },

    "bf16": {
        "enabled": ${mixedPrecision}
    },

    "gradient_clipping": 1.0,

    "wall_clock_breakdown": false
}`;
                launchCmd = `deepspeed --num_nodes=${nodes} --num_gpus=${gpusPerNode} \\
    train.py --deepspeed ds_config.json`;
            }

            document.getElementById('configOutput').querySelector('code').textContent = config;
            document.getElementById('launchCmd').querySelector('code').textContent = launchCmd;
        }

        function copyConfig() {
            const config = document.getElementById('configOutput').querySelector('code').textContent;
            navigator.clipboard.writeText(config);
        }

        // Initialize
        selectFramework('ddp');
        document.getElementById('nodes').addEventListener('change', generateConfig);
        document.getElementById('gpusPerNode').addEventListener('change', generateConfig);
        document.getElementById('batchSize').addEventListener('input', generateConfig);
        document.getElementById('gradAccum').addEventListener('input', generateConfig);
        document.getElementById('mixedPrecision').addEventListener('change', generateConfig);
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
</body>
</html>
