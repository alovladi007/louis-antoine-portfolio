<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Profiler - Distributed ML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.gradient-bg { background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #fcd34d 100%); }</style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <nav class="bg-gray-900/95 backdrop-blur-sm border-b border-amber-500/20 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="distributed-ml-complete-project.html" class="flex items-center text-amber-400 hover:text-amber-300">
                    <i class="fas fa-arrow-left mr-2"></i>Back to Distributed ML
                </a>
                <span class="text-amber-400 font-semibold">Memory Profiler</span>
            </div>
        </div>
    </nav>

    <section class="gradient-bg py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4 text-gray-900"><i class="fas fa-memory mr-4"></i>Memory Profiler</h1>
            <p class="text-xl text-amber-900">Analyze GPU memory with ZeRO stages and activation checkpointing</p>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid lg:grid-cols-4 gap-6">
            <div class="space-y-6">
                <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-6">
                    <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-cog mr-2"></i>Model Config</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Model Size</label>
                            <select id="modelSize" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                                <option value="1">1B Parameters</option>
                                <option value="7" selected>7B Parameters</option>
                                <option value="13">13B Parameters</option>
                                <option value="30">30B Parameters</option>
                                <option value="70">70B Parameters</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Batch Size: <span id="batchValue">4</span></label>
                            <input type="range" id="batchSize" min="1" max="32" value="4" class="w-full accent-amber-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Sequence Length: <span id="seqValue">2048</span></label>
                            <input type="range" id="seqLength" min="512" max="8192" step="512" value="2048" class="w-full accent-amber-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">World Size: <span id="worldValue">8</span></label>
                            <input type="range" id="worldSize" min="1" max="64" value="8" class="w-full accent-amber-500">
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-6">
                    <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-layer-group mr-2"></i>Optimization</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">ZeRO Stage</label>
                            <select id="zeroStage" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                                <option value="0">None (DDP)</option>
                                <option value="1">ZeRO-1 (Optimizer)</option>
                                <option value="2" selected>ZeRO-2 (+ Gradients)</option>
                                <option value="3">ZeRO-3 (+ Parameters)</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="flex items-center gap-2">
                                <input type="checkbox" id="checkpoint" checked class="accent-amber-500">
                                <span>Activation Checkpointing</span>
                            </label>
                            <label class="flex items-center gap-2">
                                <input type="checkbox" id="offload" class="accent-amber-500">
                                <span>CPU Offload</span>
                            </label>
                            <label class="flex items-center gap-2">
                                <input type="checkbox" id="mixedPrecision" checked class="accent-amber-500">
                                <span>Mixed Precision (FP16)</span>
                            </label>
                        </div>
                    </div>
                    <button onclick="profile()" class="w-full mt-4 bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors">
                        <i class="fas fa-calculator mr-2"></i>Calculate Memory
                    </button>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">
                <div class="grid md:grid-cols-4 gap-4">
                    <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-4 text-center">
                        <div class="text-3xl font-bold text-amber-400" id="totalMemory">-</div>
                        <div class="text-sm text-gray-400">Total / GPU</div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-4 text-center">
                        <div class="text-3xl font-bold text-green-400" id="paramMemory">-</div>
                        <div class="text-sm text-gray-400">Parameters</div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-4 text-center">
                        <div class="text-3xl font-bold text-purple-400" id="gradMemory">-</div>
                        <div class="text-sm text-gray-400">Gradients</div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-4 text-center">
                        <div class="text-3xl font-bold text-cyan-400" id="optMemory">-</div>
                        <div class="text-sm text-gray-400">Optimizer States</div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-6">
                    <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-chart-pie mr-2"></i>Memory Breakdown</h3>
                    <div id="breakdownChart" style="height: 300px;"></div>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-6">
                        <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-chart-bar mr-2"></i>ZeRO Comparison</h3>
                        <div id="zeroChart" style="height: 250px;"></div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-6">
                        <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-chart-line mr-2"></i>Batch Size vs Memory</h3>
                        <div id="batchChart" style="height: 250px;"></div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-amber-500/30 p-6">
                    <h3 class="text-lg font-semibold text-amber-400 mb-4"><i class="fas fa-server mr-2"></i>GPU Memory Visualization</h3>
                    <div id="gpuViz" class="grid grid-cols-4 gap-4"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const batchSize = document.getElementById('batchSize');
        const batchValue = document.getElementById('batchValue');
        const seqLength = document.getElementById('seqLength');
        const seqValue = document.getElementById('seqValue');
        const worldSize = document.getElementById('worldSize');
        const worldValue = document.getElementById('worldValue');

        batchSize.addEventListener('input', () => { batchValue.textContent = batchSize.value; profile(); });
        seqLength.addEventListener('input', () => { seqValue.textContent = seqLength.value; profile(); });
        worldSize.addEventListener('input', () => { worldValue.textContent = worldSize.value; profile(); });
        document.getElementById('modelSize').addEventListener('change', profile);
        document.getElementById('zeroStage').addEventListener('change', profile);
        document.getElementById('checkpoint').addEventListener('change', profile);
        document.getElementById('offload').addEventListener('change', profile);
        document.getElementById('mixedPrecision').addEventListener('change', profile);

        function profile() {
            const params = parseFloat(document.getElementById('modelSize').value) * 1e9;
            const batch = parseInt(batchSize.value);
            const seq = parseInt(seqLength.value);
            const world = parseInt(worldSize.value);
            const zero = parseInt(document.getElementById('zeroStage').value);
            const checkpoint = document.getElementById('checkpoint').checked;
            const offload = document.getElementById('offload').checked;
            const fp16 = document.getElementById('mixedPrecision').checked;

            const bytesPerParam = fp16 ? 2 : 4;
            const hiddenSize = Math.sqrt(params / 12) * 64; // Rough estimate

            // Parameter memory
            let paramMem = params * bytesPerParam / 1e9;
            if (zero >= 3) paramMem /= world;

            // Gradient memory
            let gradMem = params * bytesPerParam / 1e9;
            if (zero >= 2) gradMem /= world;

            // Optimizer states (Adam: 2 states per param)
            let optMem = params * 8 / 1e9; // FP32 optimizer states
            if (zero >= 1) optMem /= world;
            if (offload) optMem = 0;

            // Activation memory
            let actMem = batch * seq * hiddenSize * 12 * bytesPerParam / 1e9;
            if (checkpoint) actMem *= 0.3;

            const totalMem = paramMem + gradMem + optMem + actMem;

            // Update displays
            document.getElementById('totalMemory').textContent = totalMem.toFixed(1) + ' GB';
            document.getElementById('paramMemory').textContent = paramMem.toFixed(1) + ' GB';
            document.getElementById('gradMemory').textContent = gradMem.toFixed(1) + ' GB';
            document.getElementById('optMemory').textContent = optMem.toFixed(1) + ' GB';

            // Breakdown chart
            Plotly.newPlot('breakdownChart', [{
                labels: ['Parameters', 'Gradients', 'Optimizer', 'Activations'],
                values: [paramMem, gradMem, optMem, actMem],
                type: 'pie',
                hole: 0.4,
                marker: { colors: ['#10b981', '#8b5cf6', '#06b6d4', '#f59e0b'] },
                textfont: { color: '#fff' }
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' },
                margin: { l: 20, r: 20, t: 20, b: 20 },
                showlegend: true,
                legend: { font: { color: '#fff' } }
            }, {responsive: true});

            // ZeRO comparison
            const zeroLabels = ['None', 'ZeRO-1', 'ZeRO-2', 'ZeRO-3'];
            const baseParam = params * bytesPerParam / 1e9;
            const baseGrad = params * bytesPerParam / 1e9;
            const baseOpt = params * 8 / 1e9;
            const baseAct = batch * seq * hiddenSize * 12 * bytesPerParam / 1e9 * (checkpoint ? 0.3 : 1);

            const zeroMem = [
                baseParam + baseGrad + baseOpt + baseAct,
                baseParam + baseGrad + baseOpt / world + baseAct,
                baseParam + baseGrad / world + baseOpt / world + baseAct,
                baseParam / world + baseGrad / world + baseOpt / world + baseAct
            ];

            Plotly.newPlot('zeroChart', [{
                x: zeroLabels,
                y: zeroMem,
                type: 'bar',
                marker: { color: zeroLabels.map((_, i) => i === zero ? '#f59e0b' : '#6b7280') }
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' },
                margin: { l: 60, r: 20, t: 20, b: 50 },
                xaxis: { gridcolor: '#374151' },
                yaxis: { title: 'Memory (GB)', gridcolor: '#374151' }
            }, {responsive: true});

            // Batch size vs memory
            const batches = [1, 2, 4, 8, 16, 32];
            const batchMems = batches.map(b => {
                const act = b * seq * hiddenSize * 12 * bytesPerParam / 1e9 * (checkpoint ? 0.3 : 1);
                return paramMem + gradMem + optMem + act;
            });

            Plotly.newPlot('batchChart', [{
                x: batches,
                y: batchMems,
                mode: 'lines+markers',
                line: { color: '#f59e0b' },
                marker: { size: 8 }
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' },
                margin: { l: 60, r: 20, t: 20, b: 50 },
                xaxis: { title: 'Batch Size', gridcolor: '#374151' },
                yaxis: { title: 'Memory (GB)', gridcolor: '#374151' },
                shapes: [{ type: 'line', x0: 0, x1: 32, y0: 80, y1: 80, line: { color: '#ef4444', dash: 'dash' } }]
            }, {responsive: true});

            // GPU visualization
            const gpuViz = document.getElementById('gpuViz');
            const gpuMem = 80; // A100 80GB
            gpuViz.innerHTML = '';
            for (let i = 0; i < Math.min(world, 8); i++) {
                const usage = (totalMem / gpuMem) * 100;
                const usageColor = usage > 90 ? 'bg-red-500' : usage > 70 ? 'bg-yellow-500' : 'bg-green-500';
                gpuViz.innerHTML += `
                    <div class="bg-gray-700/50 rounded-lg p-4">
                        <div class="text-sm font-semibold mb-2">GPU ${i}</div>
                        <div class="w-full bg-gray-600 rounded-full h-4 mb-2">
                            <div class="${usageColor} h-4 rounded-full" style="width: ${Math.min(usage, 100)}%"></div>
                        </div>
                        <div class="text-xs text-gray-400">${totalMem.toFixed(1)} / ${gpuMem} GB</div>
                    </div>
                `;
            }
        }

        profile();
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
</body>
</html>
