<!DOCTYPE html>
<html lang="en">
<head>
    <!-- SEO + OG (auto-injected by scripts/inject-meta-tags.py) -->
    <meta name="description" content="Visual Question Answering - Multimodal AI — part of the engineering portfolio of Louis Vladimir Antoine, covering hardware, semiconductors, photonics, and software systems.">

    <title>Visual Question Answering - Multimodal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.gradient-bg { background: linear-gradient(135deg, #ec4899 0%, #f472b6 50%, #fb7185 100%); }</style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <nav class="bg-gray-900/95 backdrop-blur-sm border-b border-pink-500/20 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="multimodal-ai-complete-project.html" class="flex items-center text-pink-400 hover:text-pink-300">
                    <i class="fas fa-arrow-left mr-2"></i>Back to Multimodal AI
                </a>
                <span class="text-pink-400 font-semibold">Visual QA</span>
            </div>
        </div>
    </nav>

    <section class="gradient-bg py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4"><i class="fas fa-question-circle mr-4"></i>Visual Question Answering</h1>
            <p class="text-xl text-pink-100">Ask natural language questions about images</p>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid lg:grid-cols-2 gap-8">
            <div class="space-y-6">
                <div class="bg-gray-800 rounded-xl border border-pink-500/30 p-6">
                    <h3 class="text-lg font-semibold text-pink-400 mb-4"><i class="fas fa-image mr-2"></i>Image</h3>
                    <div id="imageDisplay" class="w-full h-64 bg-gradient-to-br from-pink-500/20 to-purple-500/20 rounded-lg flex items-center justify-center mb-4">
                        <i class="fas fa-city text-8xl text-pink-300" id="imageIcon"></i>
                    </div>
                    <select id="sampleImage" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                        <option value="city">City Street Scene</option>
                        <option value="kitchen">Kitchen Interior</option>
                        <option value="beach">Beach Landscape</option>
                        <option value="office">Office Workspace</option>
                        <option value="park">Park with People</option>
                    </select>
                </div>

                <div class="bg-gray-800 rounded-xl border border-pink-500/30 p-6">
                    <h3 class="text-lg font-semibold text-pink-400 mb-4"><i class="fas fa-comments mr-2"></i>Ask a Question</h3>
                    <input type="text" id="question" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white mb-4" placeholder="What do you see in this image?">
                    <div class="flex flex-wrap gap-2 mb-4">
                        <button onclick="setQuestion('What objects are in this image?')" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded-full text-sm">Objects</button>
                        <button onclick="setQuestion('How many people are there?')" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded-full text-sm">Count people</button>
                        <button onclick="setQuestion('What is the weather like?')" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded-full text-sm">Weather</button>
                        <button onclick="setQuestion('What colors are dominant?')" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded-full text-sm">Colors</button>
                        <button onclick="setQuestion('Describe the scene')" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded-full text-sm">Describe</button>
                    </div>
                    <button onclick="askQuestion()" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors">
                        <i class="fas fa-paper-plane mr-2"></i>Ask
                    </button>
                </div>

                <div class="bg-gray-800 rounded-xl border border-pink-500/30 p-6">
                    <h3 class="text-lg font-semibold text-pink-400 mb-4"><i class="fas fa-cog mr-2"></i>Model Settings</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">VQA Model</label>
                            <select id="vqaModel" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                                <option value="blip">BLIP-2</option>
                                <option value="llava" selected>LLaVA-1.5</option>
                                <option value="instructblip">InstructBLIP</option>
                                <option value="qwen">Qwen-VL</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Max Tokens: <span id="tokensValue">100</span></label>
                            <input type="range" id="maxTokens" min="20" max="300" value="100" class="w-full accent-pink-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Temperature: <span id="tempValue">0.7</span></label>
                            <input type="range" id="temperature" min="0" max="1.5" step="0.1" value="0.7" class="w-full accent-pink-500">
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-gray-800 rounded-xl border border-pink-500/30 p-6">
                    <h3 class="text-lg font-semibold text-pink-400 mb-4"><i class="fas fa-reply mr-2"></i>Answer</h3>
                    <div id="answerBox" class="bg-gray-900 rounded-lg p-4 min-h-32">
                        <p class="text-gray-400 italic" id="answer">Answer will appear here...</p>
                    </div>
                    <div class="mt-4 grid grid-cols-3 gap-4 text-center">
                        <div class="bg-gray-700/50 rounded-lg p-3">
                            <div class="text-xl font-bold text-pink-400" id="confidence">-</div>
                            <div class="text-xs text-gray-400">Confidence</div>
                        </div>
                        <div class="bg-gray-700/50 rounded-lg p-3">
                            <div class="text-xl font-bold text-pink-400" id="inferenceTime">-</div>
                            <div class="text-xs text-gray-400">Inference</div>
                        </div>
                        <div class="bg-gray-700/50 rounded-lg p-3">
                            <div class="text-xl font-bold text-pink-400" id="tokenCount">-</div>
                            <div class="text-xs text-gray-400">Tokens</div>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-pink-500/30 p-6">
                    <h3 class="text-lg font-semibold text-pink-400 mb-4"><i class="fas fa-history mr-2"></i>Conversation History</h3>
                    <div id="conversationHistory" class="space-y-3 max-h-64 overflow-y-auto"></div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-pink-500/30 p-6">
                    <h3 class="text-lg font-semibold text-pink-400 mb-4"><i class="fas fa-eye mr-2"></i>Attention Visualization</h3>
                    <div id="attentionChart" style="height: 200px;"></div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-pink-500/30 p-6">
                    <h3 class="text-lg font-semibold text-pink-400 mb-4"><i class="fas fa-chart-pie mr-2"></i>Answer Type Distribution</h3>
                    <div id="answerTypeChart" style="height: 200px;"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const maxTokens = document.getElementById('maxTokens');
        const tokensValue = document.getElementById('tokensValue');
        const temperature = document.getElementById('temperature');
        const tempValue = document.getElementById('tempValue');

        maxTokens.addEventListener('input', () => tokensValue.textContent = maxTokens.value);
        temperature.addEventListener('input', () => tempValue.textContent = temperature.value);

        const imageIcons = {
            city: 'fa-city',
            kitchen: 'fa-sink',
            beach: 'fa-umbrella-beach',
            office: 'fa-laptop',
            park: 'fa-tree'
        };

        const sceneAnswers = {
            city: {
                objects: "I can see cars, buildings, traffic lights, pedestrians on sidewalks, and street signs in this urban scene.",
                people: "There appear to be approximately 8-10 people visible in the scene, mostly pedestrians crossing the street or walking on sidewalks.",
                weather: "The weather appears to be clear and sunny, with blue skies visible between the buildings.",
                colors: "The dominant colors are gray from the buildings and pavement, with blue sky, and various colored cars.",
                describe: "This is a bustling city street scene with tall buildings on both sides, cars driving on the road, and pedestrians walking on the sidewalks. Traffic lights and street signs are visible."
            },
            kitchen: {
                objects: "I can see kitchen cabinets, a refrigerator, countertops, a stove, a sink, and various cooking utensils.",
                people: "There are no people visible in this kitchen image.",
                weather: "This is an indoor scene, so weather is not visible. The lighting suggests daytime.",
                colors: "The dominant colors are white from the cabinets, silver/stainless steel from appliances, and warm wood tones on the countertops.",
                describe: "This is a modern kitchen interior with white cabinets, stainless steel appliances, granite countertops, and good natural lighting from a window."
            },
            beach: {
                objects: "I can see sand, ocean waves, a beach umbrella, beach chairs, and seashells on the shore.",
                people: "There are about 3-4 people visible on the beach, some swimming and others lounging.",
                weather: "The weather is sunny and warm, with clear blue skies and calm seas.",
                colors: "The dominant colors are blue from the ocean and sky, tan/beige from the sand, and white from the waves.",
                describe: "This is a beautiful beach scene with golden sand meeting turquoise waters. Beach umbrellas provide shade, and gentle waves roll onto the shore."
            },
            office: {
                objects: "I can see a desk, computer monitor, keyboard, office chair, desk lamp, and some documents.",
                people: "There is one person visible, sitting at the desk working on a computer.",
                weather: "This is an indoor scene. Through the window, the weather appears to be overcast.",
                colors: "The dominant colors are neutral tones - gray, white, and black from the furniture and electronics.",
                describe: "This is a modern office workspace with a clean desk setup, ergonomic chair, and a large monitor. Natural light comes through nearby windows."
            },
            park: {
                objects: "I can see trees, grass, a walking path, park benches, and a playground in the distance.",
                people: "There are approximately 5-6 people visible, including families with children and people walking dogs.",
                weather: "The weather is pleasant - partly cloudy with sunshine filtering through the trees.",
                colors: "The dominant colors are various shades of green from the grass and trees, brown from the paths, and blue sky.",
                describe: "This is a peaceful park scene with mature trees, well-maintained grass, winding paths, and people enjoying outdoor activities."
            }
        };

        let conversationHistory = [];

        document.getElementById('sampleImage').addEventListener('change', function() {
            const icon = imageIcons[this.value];
            document.getElementById('imageIcon').className = `fas ${icon} text-8xl text-pink-300`;
            conversationHistory = [];
            updateConversationHistory();
        });

        function setQuestion(q) {
            document.getElementById('question').value = q;
        }

        function getAnswerType(question) {
            const q = question.toLowerCase();
            if (q.includes('how many') || q.includes('count')) return 'counting';
            if (q.includes('what color') || q.includes('colors')) return 'color';
            if (q.includes('where') || q.includes('location')) return 'spatial';
            if (q.includes('who') || q.includes('people')) return 'person';
            if (q.includes('describe') || q.includes('what is')) return 'description';
            return 'object';
        }

        function askQuestion() {
            const question = document.getElementById('question').value;
            const scene = document.getElementById('sampleImage').value;
            const model = document.getElementById('vqaModel').value;

            // Determine answer based on question type
            const q = question.toLowerCase();
            let answer;
            if (q.includes('object') || q.includes('see')) answer = sceneAnswers[scene].objects;
            else if (q.includes('people') || q.includes('many')) answer = sceneAnswers[scene].people;
            else if (q.includes('weather')) answer = sceneAnswers[scene].weather;
            else if (q.includes('color')) answer = sceneAnswers[scene].colors;
            else answer = sceneAnswers[scene].describe;

            // Display answer
            document.getElementById('answer').textContent = answer;
            document.getElementById('answer').className = 'text-white';

            // Metrics
            const confidence = 0.85 + Math.random() * 0.12;
            const inferenceTime = 150 + Math.random() * 200;
            const tokens = answer.split(' ').length;

            document.getElementById('confidence').textContent = (confidence * 100).toFixed(0) + '%';
            document.getElementById('inferenceTime').textContent = inferenceTime.toFixed(0) + 'ms';
            document.getElementById('tokenCount').textContent = tokens;

            // Add to conversation history
            conversationHistory.push({ q: question, a: answer });
            updateConversationHistory();

            // Attention visualization
            const regions = ['Top-left', 'Top-right', 'Center', 'Bottom-left', 'Bottom-right'];
            const attention = regions.map(() => Math.random());
            const maxAtt = Math.max(...attention);
            const normAttention = attention.map(a => a / maxAtt);

            Plotly.newPlot('attentionChart', [{
                x: regions,
                y: normAttention,
                type: 'bar',
                marker: {
                    color: normAttention.map(a => `rgba(236, 72, 153, ${a})`),
                    line: { color: '#f472b6', width: 1 }
                }
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' },
                margin: { l: 50, r: 20, t: 10, b: 60 },
                xaxis: { gridcolor: '#374151' },
                yaxis: { title: 'Attention', gridcolor: '#374151', range: [0, 1] }
            }, {responsive: true});

            // Answer type distribution (from history)
            const typeCounts = { counting: 0, color: 0, spatial: 0, person: 0, description: 0, object: 0 };
            conversationHistory.forEach(h => {
                typeCounts[getAnswerType(h.q)]++;
            });

            Plotly.newPlot('answerTypeChart', [{
                labels: Object.keys(typeCounts),
                values: Object.values(typeCounts),
                type: 'pie',
                hole: 0.4,
                marker: { colors: ['#ec4899', '#f472b6', '#fb7185', '#fda4af', '#fecdd3', '#fff1f2'] },
                textfont: { color: '#fff' }
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' },
                margin: { l: 20, r: 20, t: 20, b: 20 },
                showlegend: true,
                legend: { font: { color: '#fff' } }
            }, {responsive: true});
        }

        function updateConversationHistory() {
            const container = document.getElementById('conversationHistory');
            container.innerHTML = conversationHistory.map((h, i) => `
                <div class="bg-gray-700/50 rounded-lg p-3">
                    <div class="text-sm text-pink-400 mb-1"><i class="fas fa-question-circle mr-1"></i>${h.q}</div>
                    <div class="text-sm text-gray-300">${h.a}</div>
                </div>
            `).join('');
        }

        // Initialize charts
        Plotly.newPlot('attentionChart', [], {
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)'
        });
        Plotly.newPlot('answerTypeChart', [], {
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)'
        });
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
</body>
</html>
