<html lang="en">
<head>

    <title>Training Dashboard - Generative Scientific</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.gradient-bg { background: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%); }</style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <nav class="bg-gray-900/95 backdrop-blur-sm border-b border-emerald-500/20 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="generative-scientific-complete-project.html" class="flex items-center text-emerald-400 hover:text-emerald-300">
                    <i class="fas fa-arrow-left mr-2"></i>Back to Generative Scientific
                </a>
                <span class="text-emerald-400 font-semibold">Training Dashboard</span>
            </div>
        </div>
    </nav>

    <section class="gradient-bg py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4 text-white"><i class="fas fa-tachometer-alt mr-4"></i>Training Dashboard</h1>
            <p class="text-xl text-emerald-100">Real-time monitoring of generative model training</p>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid md:grid-cols-6 gap-4 mb-6">
            <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-4 text-center">
                <div class="text-2xl font-bold text-emerald-400" id="epoch">0</div>
                <div class="text-xs text-gray-400">Epoch</div>
            </div>
            <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-4 text-center">
                <div class="text-2xl font-bold text-cyan-400" id="trainLoss">-</div>
                <div class="text-xs text-gray-400">Train Loss</div>
            </div>
            <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-4 text-center">
                <div class="text-2xl font-bold text-purple-400" id="valLoss">-</div>
                <div class="text-xs text-gray-400">Val Loss</div>
            </div>
            <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-4 text-center">
                <div class="text-2xl font-bold text-amber-400" id="lr">-</div>
                <div class="text-xs text-gray-400">Learning Rate</div>
            </div>
            <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-4 text-center">
                <div class="text-2xl font-bold text-pink-400" id="gpu">-</div>
                <div class="text-xs text-gray-400">GPU Util</div>
            </div>
            <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-4 text-center">
                <div class="text-2xl font-bold text-blue-400" id="eta">-</div>
                <div class="text-xs text-gray-400">ETA</div>
            </div>
        </div>

        <div class="flex gap-4 mb-6">
            <button onclick="startTraining()" id="startBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-6 rounded-lg transition-colors">
                <i class="fas fa-play mr-2"></i>Start Training
            </button>
            <button onclick="pauseTraining()" id="pauseBtn" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-6 rounded-lg transition-colors" disabled>
                <i class="fas fa-pause mr-2"></i>Pause
            </button>
            <button onclick="stopTraining()" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-6 rounded-lg transition-colors">
                <i class="fas fa-stop mr-2"></i>Stop
            </button>
            <select id="experiment" class="bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                <option value="vae">VAE Molecular</option>
                <option value="diffusion">Diffusion Material</option>
                <option value="flow">Flow Protein</option>
            </select>
        </div>

        <div class="grid lg:grid-cols-2 gap-6 mb-6">
            <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-6">
                <h3 class="text-lg font-semibold text-emerald-400 mb-4"><i class="fas fa-chart-line mr-2"></i>Loss Curves</h3>
                <div id="lossChart" style="height: 300px;"></div>
            </div>
            <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-6">
                <h3 class="text-lg font-semibold text-emerald-400 mb-4"><i class="fas fa-chart-area mr-2"></i>Metrics</h3>
                <div id="metricsChart" style="height: 300px;"></div>
            </div>
        </div>

        <div class="grid lg:grid-cols-3 gap-6 mb-6">
            <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-6">
                <h3 class="text-lg font-semibold text-emerald-400 mb-4"><i class="fas fa-memory mr-2"></i>GPU Memory</h3>
                <div id="memoryChart" style="height: 200px;"></div>
            </div>
            <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-6">
                <h3 class="text-lg font-semibold text-emerald-400 mb-4"><i class="fas fa-fire mr-2"></i>Gradient Norms</h3>
                <div id="gradChart" style="height: 200px;"></div>
            </div>
            <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-6">
                <h3 class="text-lg font-semibold text-emerald-400 mb-4"><i class="fas fa-random mr-2"></i>KL Divergence</h3>
                <div id="klChart" style="height: 200px;"></div>
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-6">
            <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-6">
                <h3 class="text-lg font-semibold text-emerald-400 mb-4"><i class="fas fa-images mr-2"></i>Generated Samples</h3>
                <div id="samplesGrid" class="grid grid-cols-4 gap-2">
                    <div class="aspect-square bg-gray-700 rounded-lg flex items-center justify-center text-gray-500">
                        <i class="fas fa-atom text-2xl"></i>
                    </div>
                    <div class="aspect-square bg-gray-700 rounded-lg flex items-center justify-center text-gray-500">
                        <i class="fas fa-atom text-2xl"></i>
                    </div>
                    <div class="aspect-square bg-gray-700 rounded-lg flex items-center justify-center text-gray-500">
                        <i class="fas fa-atom text-2xl"></i>
                    </div>
                    <div class="aspect-square bg-gray-700 rounded-lg flex items-center justify-center text-gray-500">
                        <i class="fas fa-atom text-2xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-6">
                <h3 class="text-lg font-semibold text-emerald-400 mb-4"><i class="fas fa-terminal mr-2"></i>Training Log</h3>
                <div id="logOutput" class="bg-gray-900 rounded-lg p-4 h-48 overflow-y-auto text-xs font-mono text-gray-300"></div>
            </div>
        </div>
    </main>

    <script>
        let isTraining = false;
        let trainingData = { trainLoss: [], valLoss: [], validity: [], novelty: [], memory: [], gradNorm: [], kl: [] };
        let currentEpoch = 0;
        let intervalId = null;

        function startTraining() {
            isTraining = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            addLog('Starting training...');
            addLog('Loading dataset: ZINC250K');
            addLog('Model: VAE with 10M parameters');
            addLog('Optimizer: AdamW, LR: 1e-4');

            intervalId = setInterval(updateTraining, 500);
        }

        function pauseTraining() {
            isTraining = !isTraining;
            document.getElementById('pauseBtn').innerHTML = isTraining ?
                '<i class="fas fa-pause mr-2"></i>Pause' :
                '<i class="fas fa-play mr-2"></i>Resume';
            addLog(isTraining ? 'Training resumed' : 'Training paused');
        }

        function stopTraining() {
            isTraining = false;
            clearInterval(intervalId);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            addLog('Training stopped');
        }

        function updateTraining() {
            if (!isTraining) return;

            currentEpoch += 0.1;
            const epoch = Math.floor(currentEpoch);

            // Simulate metrics
            const trainLoss = 2.5 * Math.exp(-currentEpoch * 0.05) + 0.3 + Math.random() * 0.1;
            const valLoss = 2.6 * Math.exp(-currentEpoch * 0.04) + 0.35 + Math.random() * 0.15;
            const validity = Math.min(0.98, 0.5 + currentEpoch * 0.01 + Math.random() * 0.02);
            const novelty = Math.min(0.95, 0.3 + currentEpoch * 0.015 + Math.random() * 0.03);
            const memory = 8 + Math.random() * 2;
            const gradNorm = 1 + Math.random() * 0.5;
            const kl = 5 * Math.exp(-currentEpoch * 0.03) + 0.5 + Math.random() * 0.2;

            trainingData.trainLoss.push(trainLoss);
            trainingData.valLoss.push(valLoss);
            trainingData.validity.push(validity);
            trainingData.novelty.push(novelty);
            trainingData.memory.push(memory);
            trainingData.gradNorm.push(gradNorm);
            trainingData.kl.push(kl);

            // Update stats
            document.getElementById('epoch').textContent = epoch;
            document.getElementById('trainLoss').textContent = trainLoss.toFixed(3);
            document.getElementById('valLoss').textContent = valLoss.toFixed(3);
            document.getElementById('lr').textContent = '1e-4';
            document.getElementById('gpu').textContent = (85 + Math.random() * 10).toFixed(0) + '%';
            document.getElementById('eta').textContent = Math.max(0, 100 - epoch) + ' min';

            // Update charts
            updateCharts();

            // Update samples periodically
            if (Math.floor(currentEpoch) % 5 === 0 && currentEpoch % 1 < 0.15) {
                updateSamples();
                addLog(`Epoch ${epoch}: train_loss=${trainLoss.toFixed(4)}, val_loss=${valLoss.toFixed(4)}, validity=${(validity * 100).toFixed(1)}%`);
            }
        }

        function updateCharts() {
            // Loss chart
            Plotly.react('lossChart', [
                { y: trainingData.trainLoss, name: 'Train', line: { color: '#10b981' } },
                { y: trainingData.valLoss, name: 'Val', line: { color: '#f59e0b' } }
            ], {
                paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' }, margin: { l: 50, r: 20, t: 10, b: 40 },
                xaxis: { title: 'Step', gridcolor: '#374151' },
                yaxis: { title: 'Loss', gridcolor: '#374151' },
                legend: { orientation: 'h', y: 1.1 }
            }, {responsive: true});

            // Metrics chart
            Plotly.react('metricsChart', [
                { y: trainingData.validity.map(v => v * 100), name: 'Validity %', line: { color: '#3b82f6' } },
                { y: trainingData.novelty.map(v => v * 100), name: 'Novelty %', line: { color: '#8b5cf6' } }
            ], {
                paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' }, margin: { l: 50, r: 20, t: 10, b: 40 },
                xaxis: { title: 'Step', gridcolor: '#374151' },
                yaxis: { title: '%', gridcolor: '#374151', range: [0, 100] },
                legend: { orientation: 'h', y: 1.1 }
            }, {responsive: true});

            // Memory chart
            Plotly.react('memoryChart', [{
                y: trainingData.memory, type: 'scatter', fill: 'tozeroy',
                fillcolor: 'rgba(236, 72, 153, 0.3)', line: { color: '#ec4899' }
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' }, margin: { l: 40, r: 20, t: 10, b: 30 },
                xaxis: { gridcolor: '#374151' },
                yaxis: { title: 'GB', gridcolor: '#374151' }
            }, {responsive: true});

            // Gradient norm chart
            Plotly.react('gradChart', [{
                y: trainingData.gradNorm, type: 'scatter', line: { color: '#f59e0b' }
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' }, margin: { l: 40, r: 20, t: 10, b: 30 },
                xaxis: { gridcolor: '#374151' },
                yaxis: { title: 'Norm', gridcolor: '#374151' }
            }, {responsive: true});

            // KL chart
            Plotly.react('klChart', [{
                y: trainingData.kl, type: 'scatter', fill: 'tozeroy',
                fillcolor: 'rgba(139, 92, 246, 0.3)', line: { color: '#8b5cf6' }
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' }, margin: { l: 40, r: 20, t: 10, b: 30 },
                xaxis: { gridcolor: '#374151' },
                yaxis: { title: 'KL', gridcolor: '#374151' }
            }, {responsive: true});
        }

        function updateSamples() {
            const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6'];
            const grid = document.getElementById('samplesGrid');
            grid.innerHTML = Array.from({length: 4}, () => {
                const numAtoms = 5 + Math.floor(Math.random() * 10);
                const atoms = Array.from({length: numAtoms}, () => ({
                    x: 10 + Math.random() * 80,
                    y: 10 + Math.random() * 80,
                    r: 4 + Math.random() * 4,
                    color: colors[Math.floor(Math.random() * colors.length)]
                }));
                return `
                    <div class="aspect-square bg-gray-700 rounded-lg p-1">
                        <svg viewBox="0 0 100 100" class="w-full h-full">
                            ${atoms.slice(0, -1).map((a, i) => {
                                const b = atoms[i + 1];
                                const d = Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
                                return d < 30 ? `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#6b7280" stroke-width="1"/>` : '';
                            }).join('')}
                            ${atoms.map(a => `<circle cx="${a.x}" cy="${a.y}" r="${a.r}" fill="${a.color}"/>`).join('')}
                        </svg>
                    </div>
                `;
            }).join('');
        }

        function addLog(message) {
            const log = document.getElementById('logOutput');
            const time = new Date().toLocaleTimeString();
            log.innerHTML += `<div>[${time}] ${message}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        // Initialize empty charts
        updateCharts();
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
</body>
</html>
