<body class="bg-gray-900 text-white min-h-screen">

                </a>
                <span class="text-emerald-400 font-semibold">Model Builder</span>
            </div>
        </div>
    </nav>

    <section class="gradient-bg py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4 text-white"><i class="fas fa-cubes mr-4"></i>Model Builder</h1>
            <p class="text-xl text-emerald-100">Build and configure generative models for scientific applications</p>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid lg:grid-cols-3 gap-6">
            <div class="space-y-6">
                <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-6">
                    <h3 class="text-lg font-semibold text-emerald-400 mb-4"><i class="fas fa-project-diagram mr-2"></i>Architecture</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Model Type</label>
                            <select id="modelType" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white" onchange="updateArchitecture()">
                                <option value="vae">Variational Autoencoder (VAE)</option>
                                <option value="diffusion">Diffusion Model</option>
                                <option value="flow">Normalizing Flow</option>
                                <option value="gan">GAN</option>
                                <option value="autoregressive">Autoregressive</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Data Modality</label>
                            <select id="modality" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white">
                                <option value="graph">Molecular Graphs</option>
                                <option value="point_cloud">3D Point Clouds</option>
                                <option value="sequence">Sequences</option>
                                <option value="image">2D Images</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Latent Dimension: <span id="latentVal">256</span></label>
                            <input type="range" id="latentDim" min="32" max="1024" step="32" value="256" class="w-full accent-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Hidden Layers: <span id="layersVal">4</span></label>
                            <input type="range" id="numLayers" min="2" max="12" value="4" class="w-full accent-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Hidden Dim: <span id="hiddenVal">512</span></label>
                            <input type="range" id="hiddenDim" min="128" max="2048" step="128" value="512" class="w-full accent-emerald-500">
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-6">
                    <h3 class="text-lg font-semibold text-emerald-400 mb-4"><i class="fas fa-cog mr-2"></i>Advanced Options</h3>
                    <div class="space-y-3">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="equivariant" class="w-4 h-4 accent-emerald-500" checked>
                            <span class="text-sm text-gray-300">E(3) Equivariant</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="conditional" class="w-4 h-4 accent-emerald-500">
                            <span class="text-sm text-gray-300">Conditional Generation</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="attention" class="w-4 h-4 accent-emerald-500" checked>
                            <span class="text-sm text-gray-300">Self-Attention</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="residual" class="w-4 h-4 accent-emerald-500" checked>
                            <span class="text-sm text-gray-300">Residual Connections</span>
                        </label>
                    </div>
                </div>

                <button onclick="buildModel()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors">
                    <i class="fas fa-hammer mr-2"></i>Build Model
                </button>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="grid md:grid-cols-4 gap-4">
                    <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-4 text-center">
                        <div class="text-2xl font-bold text-emerald-400" id="totalParams">-</div>
                        <div class="text-sm text-gray-400">Parameters</div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-4 text-center">
                        <div class="text-2xl font-bold text-cyan-400" id="memoryReq">-</div>
                        <div class="text-sm text-gray-400">Memory (GB)</div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-4 text-center">
                        <div class="text-2xl font-bold text-purple-400" id="flops">-</div>
                        <div class="text-sm text-gray-400">GFLOPs</div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-4 text-center">
                        <div class="text-2xl font-bold text-amber-400" id="inferenceTime">-</div>
                        <div class="text-sm text-gray-400">Inference (ms)</div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-6">
                    <h3 class="text-lg font-semibold text-emerald-400 mb-4"><i class="fas fa-sitemap mr-2"></i>Architecture Diagram</h3>
                    <div id="architectureViz" class="h-80 overflow-auto"></div>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-6">
                        <h3 class="text-lg font-semibold text-emerald-400 mb-4"><i class="fas fa-chart-pie mr-2"></i>Parameter Distribution</h3>
                        <div id="paramChart" style="height: 250px;"></div>
                    </div>
                    <div class="bg-gray-800 rounded-xl border border-emerald-500/30 p-6">
                        <h3 class="text-lg font-semibold text-emerald-400 mb-4"><i class="fas fa-code mr-2"></i>Model Config</h3>
                        <pre id="configCode" class="text-xs bg-gray-900 p-4 rounded-lg overflow-auto h-56 text-gray-300"></pre>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('latentDim').addEventListener('input', e => { document.getElementById('latentVal').textContent = e.target.value; updateArchitecture(); });
        document.getElementById('numLayers').addEventListener('input', e => { document.getElementById('layersVal').textContent = e.target.value; updateArchitecture(); });
        document.getElementById('hiddenDim').addEventListener('input', e => { document.getElementById('hiddenVal').textContent = e.target.value; updateArchitecture(); });

        function updateArchitecture() {
            const modelType = document.getElementById('modelType').value;
            const latentDim = parseInt(document.getElementById('latentDim').value);
            const numLayers = parseInt(document.getElementById('numLayers').value);
            const hiddenDim = parseInt(document.getElementById('hiddenDim').value);

            // Calculate parameters
            const baseParams = latentDim * hiddenDim * 2;
            const layerParams = hiddenDim * hiddenDim * numLayers;
            const totalParams = baseParams + layerParams;
            const memory = (totalParams * 4) / (1024 * 1024 * 1024);
            const flops = totalParams * 2 / 1e9;
            const inference = 5 + numLayers * 2 + hiddenDim / 100;

            document.getElementById('totalParams').textContent = (totalParams / 1e6).toFixed(1) + 'M';
            document.getElementById('memoryReq').textContent = memory.toFixed(2);
            document.getElementById('flops').textContent = flops.toFixed(1);
            document.getElementById('inferenceTime').textContent = inference.toFixed(0);
        }

        function buildModel() {
            const modelType = document.getElementById('modelType').value;
            const modality = document.getElementById('modality').value;
            const latentDim = parseInt(document.getElementById('latentDim').value);
            const numLayers = parseInt(document.getElementById('numLayers').value);
            const hiddenDim = parseInt(document.getElementById('hiddenDim').value);
            const equivariant = document.getElementById('equivariant').checked;
            const conditional = document.getElementById('conditional').checked;
            const attention = document.getElementById('attention').checked;

            // Architecture visualization
            const layers = [];
            const colors = { encoder: '#3b82f6', latent: '#10b981', decoder: '#f59e0b', attention: '#8b5cf6' };

            if (modelType === 'vae') {
                layers.push({ name: 'Input Layer', type: 'encoder', params: hiddenDim * 64 });
                for (let i = 0; i < numLayers / 2; i++) {
                    layers.push({ name: `Encoder ${i + 1}`, type: 'encoder', params: hiddenDim * hiddenDim });
                    if (attention) layers.push({ name: `Attention ${i + 1}`, type: 'attention', params: hiddenDim * hiddenDim / 4 });
                }
                layers.push({ name: 'μ Layer', type: 'latent', params: hiddenDim * latentDim });
                layers.push({ name: 'σ Layer', type: 'latent', params: hiddenDim * latentDim });
                layers.push({ name: 'Latent z', type: 'latent', params: latentDim });
                for (let i = 0; i < numLayers / 2; i++) {
                    layers.push({ name: `Decoder ${i + 1}`, type: 'decoder', params: hiddenDim * hiddenDim });
                }
                layers.push({ name: 'Output Layer', type: 'decoder', params: hiddenDim * 64 });
            } else if (modelType === 'diffusion') {
                layers.push({ name: 'Noise Schedule', type: 'latent', params: 1000 });
                for (let i = 0; i < numLayers; i++) {
                    layers.push({ name: `UNet Block ${i + 1}`, type: 'encoder', params: hiddenDim * hiddenDim });
                    if (attention && i % 2 === 0) layers.push({ name: `Cross-Attn ${i / 2 + 1}`, type: 'attention', params: hiddenDim * hiddenDim / 2 });
                }
                layers.push({ name: 'Output Projection', type: 'decoder', params: hiddenDim * 64 });
            } else {
                for (let i = 0; i < numLayers; i++) {
                    layers.push({ name: `Layer ${i + 1}`, type: i < numLayers / 2 ? 'encoder' : 'decoder', params: hiddenDim * hiddenDim });
                }
            }

            document.getElementById('architectureViz').innerHTML = `
                <div class="flex flex-col gap-2">
                    ${layers.map(l => `
                        <div class="flex items-center gap-3">
                            <div class="w-32 text-right text-sm text-gray-400">${(l.params / 1e3).toFixed(0)}K params</div>
                            <div class="flex-1 h-10 rounded-lg flex items-center px-4 text-sm font-medium" style="background: ${colors[l.type]}">
                                ${l.name}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            // Parameter distribution chart
            const paramsByType = { encoder: 0, latent: 0, decoder: 0, attention: 0 };
            layers.forEach(l => paramsByType[l.type] += l.params);

            Plotly.newPlot('paramChart', [{
                values: Object.values(paramsByType),
                labels: ['Encoder', 'Latent', 'Decoder', 'Attention'],
                type: 'pie',
                marker: { colors: [colors.encoder, colors.latent, colors.decoder, colors.attention] },
                textinfo: 'label+percent'
            }], {
                paper_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#fff' },
                margin: { l: 20, r: 20, t: 20, b: 20 },
                showlegend: false
            }, {responsive: true});

            // Config code
            const config = {
                model_type: modelType,
                modality: modality,
                latent_dim: latentDim,
                hidden_dim: hiddenDim,
                num_layers: numLayers,
                equivariant: equivariant,
                conditional: conditional,
                attention: attention,
                activation: 'gelu',
                dropout: 0.1
            };

            document.getElementById('configCode').textContent = JSON.stringify(config, null, 2);
        }

        // Initialize
        updateArchitecture();
    </script>
    <script src="../../assets/js/chatbot-bubble.js" defer></script>
</body>
