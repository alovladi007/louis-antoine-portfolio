    <!-- Interactive Demo -->
    <section class="section">
        <div class="demo-container">
            <h2 class="section-title">Interactive SPC/FDC Monitoring</h2>
            
            <!-- Controls -->
            <div class="controls">
                <div class="control-group">
                    <label class="control-label">Process Parameter</label>
                    <select class="control-input" id="processParam">
                        <option value="cd">CD (nm)</option>
                        <option value="overlay">Overlay (nm)</option>

                    </select>
                </div>
                <div class="control-group">
                    <label class="control-label">Control Limit (σ)</label>
                    <input type="range" class="control-input" id="controlLimit" min="1" max="5" step="0.5" value="3">
                    <span id="controlLimitValue">3σ</span>
                </div>
                <div class="control-group">
                    <label class="control-label">Sample Size</label>
                    <input type="range" class="control-input" id="sampleSize" min="10" max="100" step="5" value="50">
                    <span id="sampleSizeValue">50</span>
                </div>
                <div class="control-group">
                    <label class="control-label">Fault Probability</label>
                    <input type="range" class="control-input" id="faultProb" min="0" max="0.3" step="0.01" value="0.05">
                    <span id="faultProbValue">5%</span>
                </div>
                <div class="control-group">
                    <label class="control-label">Update Rate (s)</label>
                    <input type="range" class="control-input" id="updateRate" min="1" max="10" step="1" value="2">
                    <span id="updateRateValue">2s</span>
                </div>
                <div class="control-group">
                    <label class="control-label">Auto-Update</label>
                    <input type="checkbox" class="control-input" id="autoUpdate" style="width: auto;">
                </div>
            </div>

            <button class="run-button" onclick="runSPCMonitoring()">
                <i class="fas fa-play"></i> Start SPC Monitoring
            </button>

            <button class="run-button" onclick="stopSPCMonitoring()" style="background: linear-gradient(135deg, #ef4444, #dc2626);">
                <i class="fas fa-stop"></i> Stop Monitoring
            </button>

            <!-- Metrics -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-value" id="currentValue">--</div>
                    <div class="metric-label">Current Value</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="t2Statistic">--</div>
                    <div class="metric-label">T² Statistic</div>

                </div>

    <script>
        let monitoringInterval = null;
        let monitoringData = {
            samples: [],
            t2Values: [],
            speValues: [],
            timestamps: [],
            faults: []
        };

        // Update slider values
        document.getElementById('controlLimit').addEventListener('input', function() {
            document.getElementById('controlLimitValue').textContent = this.value + 'σ';
        });

        document.getElementById('sampleSize').addEventListener('input', function() {
            document.getElementById('sampleSizeValue').textContent = this.value;
        });

        document.getElementById('faultProb').addEventListener('input', function() {
            document.getElementById('faultProbValue').textContent = (this.value * 100).toFixed(0) + '%';
        });

        document.getElementById('updateRate').addEventListener('input', function() {
            document.getElementById('updateRateValue').textContent = this.value + 's';
        });

        function runSPCMonitoring() {
            const button = document.querySelector('.run-button');
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Starting Monitoring...';

            // Reset data
            monitoringData = {
                samples: [],
                t2Values: [],
                speValues: [],
                timestamps: [],
                faults: []
            };

            // Get parameters
            const controlLimit = parseFloat(document.getElementById('controlLimit').value);
            const sampleSize = parseInt(document.getElementById('sampleSize').value);
            const faultProb = parseFloat(document.getElementById('faultProb').value);
            const updateRate = parseInt(document.getElementById('updateRate').value) * 1000;

            // Initialize with historical data
            generateHistoricalData(sampleSize);

            // Start real-time monitoring
            monitoringInterval = setInterval(() => {
                generateNewSample(faultProb);
                updateCharts();
                updateMetrics();
                checkAlarms(controlLimit);
            }, updateRate);

            button.disabled = false;
            button.innerHTML = '<i class="fas fa-play"></i> Start SPC Monitoring';
        }

        function stopSPCMonitoring() {
            if (monitoringInterval) {
                clearInterval(monitoringInterval);
                monitoringInterval = null;
            }
        }

        function generateHistoricalData(sampleSize) {
            const baseValue = 50; // Base CD value
            const stdDev = 2.0;

            for (let i = 0; i < sampleSize; i++) {
                const value = baseValue + (Math.random() - 0.5) * stdDev * 2;
                const timestamp = new Date(Date.now() - (sampleSize - i) * 1000);
                
                monitoringData.samples.push(value);
                monitoringData.timestamps.push(timestamp);
                
                // Calculate T² and SPE
                const t2 = calculateT2Statistic(monitoringData.samples.slice(-10));
                const spe = calculateSPE(monitoringData.samples.slice(-10));
                
                monitoringData.t2Values.push(t2);
                monitoringData.speValues.push(spe);
            }
        }

        function generateNewSample(faultProb) {
            const baseValue = 50;
            const stdDev = 2.0;
            let value = baseValue + (Math.random() - 0.5) * stdDev * 2;
            
            // Introduce fault with probability
            if (Math.random() < faultProb) {
                value += (Math.random() - 0.5) * 10; // Large deviation
                monitoringData.faults.push({
                    timestamp: new Date(),
                    value: value,
                    type: 'Process Fault'
                });
            }
            
            monitoringData.samples.push(value);
            monitoringData.timestamps.push(new Date());
            
            // Calculate T² and SPE
            const t2 = calculateT2Statistic(monitoringData.samples.slice(-10));
            const spe = calculateSPE(monitoringData.samples.slice(-10));
            
            monitoringData.t2Values.push(t2);
            monitoringData.speValues.push(spe);
            
            // Keep only last 100 samples
            if (monitoringData.samples.length > 100) {
                monitoringData.samples.shift();
                monitoringData.timestamps.shift();
                monitoringData.t2Values.shift();
                monitoringData.speValues.shift();
            }
        }

        function calculateT2Statistic(samples) {
            if (samples.length < 2) return 0;
            
            const mean = samples.reduce((a, b) => a + b, 0) / samples.length;
            const variance = samples.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (samples.length - 1);
            const lastSample = samples[samples.length - 1];
            
            return Math.pow(lastSample - mean, 2) / variance;
        }

        function calculateSPE(samples) {
            if (samples.length < 2) return 0;
            
            const mean = samples.reduce((a, b) => a + b, 0) / samples.length;
            const lastSample = samples[samples.length - 1];
            
            return Math.pow(lastSample - mean, 2);
        }

        function updateMetrics() {
            const lastSample = monitoringData.samples[monitoringData.samples.length - 1];
            const lastT2 = monitoringData.t2Values[monitoringData.t2Values.length - 1];
            const lastSPE = monitoringData.speValues[monitoringData.speValues.length - 1];
            
            document.getElementById('currentValue').textContent = lastSample.toFixed(2);
            document.getElementById('t2Statistic').textContent = lastT2.toFixed(3);
            document.getElementById('speValue').textContent = lastSPE.toFixed(3);
            document.getElementById('faultCount').textContent = monitoringData.faults.length;
        }

        function checkAlarms(controlLimit) {
            const lastT2 = monitoringData.t2Values[monitoringData.t2Values.length - 1];
            const lastSPE = monitoringData.speValues[monitoringData.speValues.length - 1];
            
            const alarms = [];
            
            if (lastT2 > controlLimit) {
                alarms.push({
                    type: 'T² Control Limit Exceeded',
                    value: lastT2.toFixed(3),
                    status: 'critical'
                });
            }
            
            if (lastSPE > controlLimit * 2) {
                alarms.push({
                    type: 'SPE Control Limit Exceeded',
                    value: lastSPE.toFixed(3),
                    status: 'warning'
                });
            }
            
            if (alarms.length > 0) {
                showAlarms(alarms);
            } else {
                hideAlarms();
            }
        }

        function showAlarms(alarms) {
            const alarmPanel = document.getElementById('alarmPanel');
            const alarmList = document.getElementById('alarmList');
            
            alarmList.innerHTML = '';
            alarms.forEach(alarm => {
                const alarmItem = document.createElement('div');
                alarmItem.className = 'alarm-item';
                alarmItem.innerHTML = `
                    <span>${alarm.type}</span>
                    <span class="alarm-status ${alarm.status}">${alarm.value}</span>
                `;
                alarmList.appendChild(alarmItem);
            });
            
            alarmPanel.style.display = 'block';
        }

        function hideAlarms() {
            document.getElementById('alarmPanel').style.display = 'none';
        }

        function updateCharts() {
            updateSPCChart();
            updateT2Chart();
            updateSPEChart();
        }

        function updateSPCChart() {
            const x = monitoringData.timestamps.map(t => t.toLocaleTimeString());
            const samples = monitoringData.samples;
            const mean = samples.reduce((a, b) => a + b, 0) / samples.length;
            const stdDev = Math.sqrt(samples.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / samples.length);
            
            const data = [
                {
                    x: x,
                    y: samples,
                    type: 'scatter',
                    mode: 'lines+markers',
                    name: 'Process Values',
                    line: { color: '#667eea' },
                    marker: { size: 4 }
                },
                {
                    x: x,
                    y: Array(samples.length).fill(mean),
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Mean',
                    line: { color: '#22c55e', dash: 'dash' }
                },
                {
                    x: x,
                    y: Array(samples.length).fill(mean + 3 * stdDev),
                    type: 'scatter',
                    mode: 'lines',
                    name: 'UCL (+3σ)',
                    line: { color: '#ef4444', dash: 'dot' }
                },
                {
                    x: x,
                    y: Array(samples.length).fill(mean - 3 * stdDev),
                    type: 'scatter',
                    mode: 'lines',
                    name: 'LCL (-3σ)',
                    line: { color: '#ef4444', dash: 'dot' }
                }
            ];

            const layout = {
                title: 'Statistical Process Control Chart',
                xaxis: { title: 'Time' },
                yaxis: { title: 'Value' },
                plot_bgcolor: 'rgba(0,0,0,0)',
                paper_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#e0e0e0' }
            };

            Plotly.newPlot('spcChart', data, layout);
        }

        function updateT2Chart() {
            const x = monitoringData.timestamps.map(t => t.toLocaleTimeString());
            const t2Values = monitoringData.t2Values;
            const controlLimit = parseFloat(document.getElementById('controlLimit').value);

            const data = [
                {
                    x: x,
                    y: t2Values,
                    type: 'scatter',
                    mode: 'lines+markers',
                    name: 'T² Statistic',
                    line: { color: '#667eea' },
                    marker: { size: 4 }
                },
                {
                    x: x,
                    y: Array(t2Values.length).fill(controlLimit),
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Control Limit',
                    line: { color: '#ef4444', dash: 'dash' }
                }
            ];

            const layout = {
                title: 'Hotelling\'s T² Chart',
                xaxis: { title: 'Time' },
                yaxis: { title: 'T² Value' },
                plot_bgcolor: 'rgba(0,0,0,0)',
                paper_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#e0e0e0' }
            };

            Plotly.newPlot('t2Chart', data, layout);
        }

        function updateSPEChart() {
            const x = monitoringData.timestamps.map(t => t.toLocaleTimeString());
            const speValues = monitoringData.speValues;
            const controlLimit = parseFloat(document.getElementById('controlLimit').value) * 2;

            const data = [
                {
                    x: x,
                    y: speValues,
                    type: 'scatter',
                    mode: 'lines+markers',
                    name: 'SPE Value',
                    line: { color: '#667eea' },
                    marker: { size: 4 }
                },
                {
                    x: x,
                    y: Array(speValues.length).fill(controlLimit),
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Control Limit',
                    line: { color: '#ef4444', dash: 'dash' }
                }
            ];

            const layout = {
                title: 'Squared Prediction Error (SPE) Chart',
                xaxis: { title: 'Time' },
                yaxis: { title: 'SPE Value' },
                plot_bgcolor: 'rgba(0,0,0,0)',
                paper_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#e0e0e0' }
            };

            Plotly.newPlot('speChart', data, layout);
        }

        // Initialize charts on page load
        document.addEventListener('DOMContentLoaded', function() {
            updateSPCChart();
            updateT2Chart();
            updateSPEChart();
        });
    </script>
