<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>modulation - Comms</title>
<script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a0e27,#1a1f3a);color:#e0e0e0;padding:20px}.container{max-width:1400px;margin:0 auto}header{text-align:center;padding:40px 20px;background:linear-gradient(135deg,#1e3c72,#2a5298);border-radius:15px;margin-bottom:40px}h1{font-size:2.8em;color:#f59e0b;margin-bottom:15px}.subtitle{font-size:1.2em;color:#60a5fa}.nav-btn{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:white;padding:12px 24px;border-radius:8px;text-decoration:none;display:inline-flex;gap:8px;margin:10px}.plot-container{background:rgba(30,41,59,0.6);padding:25px;border-radius:15px;margin-bottom:25px;border:1px solid rgba(96,165,250,0.2)}.plot-title{font-size:1.3em;color:#f59e0b;margin-bottom:15px}</style></head>
<body><div class="container"><header><h1><i class="fas fa-signal"></i> modulation</h1>
<p class="subtitle">Communication System Analysis</p>
<a href="cross-domain-comms-complete-project.html" class="nav-btn"><i class="fas fa-home"></i> Back</a></header>
<div class="plot-container"><div class="plot-title">Performance Analysis</div><div id="plot1"></div></div>
<div class="plot-container"><div class="plot-title">Signal Characteristics</div><div id="plot2"></div></div></div>
<script>
const x=Array.from({length:50},(_,i)=>i*0.5);
const y1=x.map(v=>Math.exp(-v/10));
const y2=x.map(v=>1-Math.exp(-v/5));
Plotly.newPlot('plot1',[{x:x,y:y1,mode:'lines',line:{color:'#60a5fa',width:3}}],{plot_bgcolor:'rgba(15,23,42,0.8)',paper_bgcolor:'rgba(0,0,0,0)',font:{color:'#e0e0e0'},xaxis:{title:'SNR (dB)'},yaxis:{title:'BER'},margin:{t:20,r:20,b:60,l:60}});
Plotly.newPlot('plot2',[{x:x,y:y2,mode:'lines',line:{color:'#f59e0b',width:3}}],{plot_bgcolor:'rgba(15,23,42,0.8)',paper_bgcolor:'rgba(0,0,0,0)',font:{color:'#e0e0e0'},xaxis:{title:'Frequency (kHz)'},yaxis:{title:'Power'},margin:{t:20,r:20,b:60,l:60}});
</script></body></html>
