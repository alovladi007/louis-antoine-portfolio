[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roch-cv-quantum"
version = "0.1.0"
description = "Continuous-Variable Quantum Optics Research Suite"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Louis-Antoine Rochon", email = "your.email@rochester.edu"}
]
keywords = ["quantum optics", "integrated photonics", "CV-QKD", "squeezed light", "cluster states"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "networkx>=3.1",
    "cvxpy>=1.3.0",
    "sympy>=1.12",
    "pytest>=7.4.0",
    "jupyter>=1.0.0",
    "numba>=0.57.0",
]

[project.optional-dependencies]
jax = ["jax[cpu]>=0.4.13"]
dev = [
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/roch-cv-quantum"
Documentation = "https://github.com/yourusername/roch-cv-quantum/tree/main/docs"
Repository = "https://github.com/yourusername/roch-cv-quantum"
Issues = "https://github.com/yourusername/roch-cv-quantum/issues"

[tool.hatch.build.targets.wheel]
packages = ["common", "project_squeezer", "project_cvqkd", "project_cluster"]

[tool.pytest.ini_options]
testpaths = ["common/tests", "project_squeezer/tests", "project_cvqkd/tests", "project_cluster/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
