<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFDM Acoustic Modem - Cross-Domain Comms</title>
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%); color: #e0e0e0; line-height: 1.6; min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; padding: 40px 20px; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); border-radius: 15px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }
        h1 { font-size: 2.8em; margin-bottom: 15px; color: #f59e0b; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); }
        .subtitle { font-size: 1.2em; color: #60a5fa; margin-bottom: 10px; }
        .controls-section { background: rgba(30, 41, 59, 0.8); padding: 30px; border-radius: 15px; margin-bottom: 30px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); border: 1px solid rgba(96, 165, 250, 0.2); }
        .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-bottom: 25px; }
        .control-group { background: rgba(15, 23, 42, 0.6); padding: 20px; border-radius: 10px; border: 1px solid rgba(96, 165, 250, 0.1); }
        .control-group label { display: block; margin-bottom: 10px; color: #60a5fa; font-weight: 600; font-size: 0.95em; }
        .control-group input[type="range"] { width: 100%; margin: 10px 0; accent-color: #60a5fa; }
        .value-display { display: inline-block; min-width: 80px; padding: 5px 12px; background: rgba(96, 165, 250, 0.1); border-radius: 5px; color: #f59e0b; font-weight: bold; text-align: center; border: 1px solid rgba(96, 165, 250, 0.3); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.9) 100%); padding: 20px; border-radius: 12px; border: 1px solid rgba(96, 165, 250, 0.3); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); }
        .stat-card h3 { font-size: 0.9em; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 1.8em; color: #60a5fa; font-weight: bold; }
        .stat-card .unit { font-size: 0.9em; color: #f59e0b; margin-left: 5px; }
        .plot-container { background: rgba(30, 41, 59, 0.6); padding: 25px; border-radius: 15px; margin-bottom: 25px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); border: 1px solid rgba(96, 165, 250, 0.2); }
        .plot-title { font-size: 1.3em; color: #f59e0b; margin-bottom: 15px; font-weight: 600; }
        .nav-btn { background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%); color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; margin: 10px 5px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-wave-square"></i> OFDM Acoustic Modem</h1>
            <p class="subtitle">Orthogonal Frequency Division Multiplexing for Underwater Communications</p>
            <a href="cross-domain-comms-complete-project.html" class="nav-btn"><i class="fas fa-home"></i> Back to Project</a>
        </header>

        <div class="controls-section">
            <div class="controls-grid">
                <div class="control-group">
                    <label>Subcarriers: <span class="value-display" id="subcarriersValue">64</span></label>
                    <input type="range" id="subcarriers" min="16" max="256" step="16" value="64" oninput="updateParams()">
                </div>
                <div class="control-group">
                    <label>SNR: <span class="value-display" id="snrValue">15 dB</span></label>
                    <input type="range" id="snr" min="0" max="30" step="1" value="15" oninput="updateParams()">
                </div>
                <div class="control-group">
                    <label>Doppler: <span class="value-display" id="dopplerValue">2 Hz</span></label>
                    <input type="range" id="doppler" min="0" max="10" step="0.5" value="2" oninput="updateParams()">
                </div>
                <div class="control-group">
                    <label>Multipath Delay: <span class="value-display" id="multipathValue">5 ms</span></label>
                    <input type="range" id="multipath" min="0" max="20" step="1" value="5" oninput="updateParams()">
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><h3>Data Rate</h3><div class="value" id="dataRate">480</div><span class="unit">bps</span></div>
            <div class="stat-card"><h3>Bandwidth</h3><div class="value" id="bandwidth">12</div><span class="unit">kHz</span></div>
            <div class="stat-card"><h3>Symbol Duration</h3><div class="value" id="symbolDuration">5.3</div><span class="unit">ms</span></div>
            <div class="stat-card"><h3>BER</h3><div class="value" id="ber">1e-3</div></div>
        </div>

        <div class="plot-container">
            <div class="plot-title">Frequency Response</div>
            <div id="freqPlot"></div>
        </div>

        <div class="plot-container">
            <div class="plot-title">Constellation Diagram</div>
            <div id="constellationPlot"></div>
        </div>
    </div>

    <script>
        function updateParams() {
            const N = parseInt(document.getElementById('subcarriers').value);
            const snr = parseInt(document.getElementById('snr').value);
            const doppler = parseFloat(document.getElementById('doppler').value);
            const delay = parseInt(document.getElementById('multipath').value);

            document.getElementById('subcarriersValue').textContent = N;
            document.getElementById('snrValue').textContent = snr + ' dB';
            document.getElementById('dopplerValue').textContent = doppler + ' Hz';
            document.getElementById('multipathValue').textContent = delay + ' ms';

            const bw = N * 0.2;
            const symbolDur = (1000 / bw);
            const dataRate = N * 2 * (bw / N);

            document.getElementById('dataRate').textContent = Math.round(dataRate);
            document.getElementById('bandwidth').textContent = bw.toFixed(1);
            document.getElementById('symbolDuration').textContent = symbolDur.toFixed(1);
            document.getElementById('ber').textContent = (Math.pow(10, -(snr/10))).toExponential(1);

            updatePlots(N, snr, doppler);
        }

        function updatePlots(N, snr, doppler) {
            const freqs = Array.from({length: N}, (_, i) => i * 0.2);
            const response = freqs.map(f => 1 - Math.exp(-f/10) + Math.random()*0.1);

            Plotly.newPlot('freqPlot', [{
                x: freqs, y: response, type: 'scatter', mode: 'lines', line: {color: '#60a5fa', width: 2}
            }], {
                plot_bgcolor: 'rgba(15, 23, 42, 0.8)', paper_bgcolor: 'rgba(0, 0, 0, 0)', font: {color: '#e0e0e0'},
                xaxis: {title: 'Frequency (kHz)', gridcolor: 'rgba(96, 165, 250, 0.1)'},
                yaxis: {title: 'Magnitude', gridcolor: 'rgba(96, 165, 250, 0.1)'},
                margin: {t: 20, r: 20, b: 60, l: 60}
            });

            const noise = Math.pow(10, -snr/20);
            const I = Array.from({length: 64}, () => (Math.random()-0.5)*2 + doppler*0.01*(Math.random()-0.5));
            const Q = Array.from({length: 64}, () => (Math.random()-0.5)*2);

            Plotly.newPlot('constellationPlot', [{
                x: I, y: Q, mode: 'markers', type: 'scatter',
                marker: {size: 8, color: '#60a5fa', opacity: 0.6}
            }], {
                plot_bgcolor: 'rgba(15, 23, 42, 0.8)', paper_bgcolor: 'rgba(0, 0, 0, 0)', font: {color: '#e0e0e0'},
                xaxis: {title: 'In-Phase', gridcolor: 'rgba(96, 165, 250, 0.1)', range: [-2, 2]},
                yaxis: {title: 'Quadrature', gridcolor: 'rgba(96, 165, 250, 0.1)', range: [-2, 2], scaleanchor: 'x'},
                margin: {t: 20, r: 20, b: 60, l: 60}
            });
        }

        updateParams();
    </script>
</body>
</html>
